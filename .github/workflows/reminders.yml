name: NeuroFit Daily Reminders

on:
  schedule:
    # Запуск каждый час: скрипт сам отбирает атлетов, у которых сейчас 18:00 по их часовому поясу
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Отправить тестово всем по расписанию дня (игнорируя час 18:00)'
        required: false
        default: false
        type: boolean

jobs:
  send-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run reminders
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MINI_APP_URL: https://ingslam.github.io/neuroFit/
          STRICT_BOT_TOKEN: '1'
          FORCE_SEND: ${{ inputs.force_send && '1' || '0' }}
        run: node scripts/send_reminders.js
