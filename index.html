                <button onClick={() => setStep(1)} style={{ marginTop: 10, width: "100%", padding: 12, background: "none", border: `1px solid ${C.border}`, borderRadius: 12, color: C.text, fontSize: 13.5, fontWeight: 600, cursor: "pointer" }}>
                  ← Назад
                </button>
              </div>
            )}

            {step === 3 && (
              <div className="nf-rise" style={{ paddingTop: 14 }}>
                <BodyMap sex={sex} setSex={setSex} selected={muscles} setSelected={setMuscles} />
                <button onClick={startGen}
                        style={{ marginTop: 18, width: "100%", padding: 14, border: "none", borderRadius: 12, background: C.accent, color: "#fff", fontSize: 14.5, fontWeight: 800, cursor: "pointer" }}>
                  Собрать программу
                </button>
                <button onClick={() => setStep(hasDb ? 2 : 1)} style={{ marginTop: 10, width: "100%", padding: 12, background: "none", border: `1px solid ${C.border}`, borderRadius: 12, color: C.text, fontSize: 13.5, fontWeight: 600, cursor: "pointer" }}>
                  ← Назад
                </button>
              </div>
            )}

            {step === 4 && (
              <div style={{ paddingTop: 10 }}>
                <div style={{ fontSize: 19, fontWeight: 900 }}>Собираю программу…</div>
                <ul style={{ listStyle: "none", marginTop: 18, display: "flex", flexDirection: "column", gap: 10 }}>
                  {genStepsLabels.map((lbl, i) => {
                    const state = i < genStep ? "done" : i === genStep ? "run" : "wait";
                    return (
                      <li key={i} style={{
                        display: "flex", alignItems: "center", gap: 10, background: C.surface, border: `1px solid ${C.border}`,
                        borderRadius: 10, padding: 12, fontSize: 13, color: state === "wait" ? C.textMuted : C.text,
                        opacity: state === "wait" ? 0.45 : 1
                      }}>
                        <span style={{
                          width: 22, height: 22, borderRadius: "50%", border: `2px solid ${state === "done" ? C.done : state === "run" ? "#E67E22" : C.border}`,
                          display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, flexShrink: 0,
                          color: state === "done" ? C.done : "#E67E22",
                          animation: state === "run" ? "spin 1s linear infinite" : "none"
                        }}>
                          {state === "done" ? "✓" : state === "run" ? "◌" : ""}
                        </span>
                        {lbl}
                      </li>
                    );
                  })}
                </ul>
                {genStep >= 4 && (
                  <div className="nf-rise" style={{ marginTop: 16, background: "linear-gradient(135deg, rgba(76,154,107,.12), " + C.surface + ")", border: `1px solid rgba(76,154,107,.5)`, borderRadius: 14, padding: 14 }}>
                    <div style={{ fontSize: 15, fontWeight: 900 }}>Готово!</div>
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8 }}>
                      {["21 неделя", "3 дня / нед", "~45 мин", "гантели"].map((t) => (
                        <span key={t} style={{ fontSize: 11, fontWeight: 700, color: C.textMuted, border: `1px solid ${C.border}`, borderRadius: 6, padding: "3px 8px" }}>{t}</span>
                      ))}
                    </div>
                    <div style={{ marginTop: 10 }}>
                      {plannedPreview.map((k) => (
                        <div key={k} style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, padding: "7px 2px", borderBottom: `1px solid ${C.border}`, color: C.textMuted }}>
                          <span>{EX_BY_KEY[k].name}</span>
                          <b style={{ color: C.text, fontFamily: "ui-monospace, monospace" }}>{(previewPlan.db && previewPlan.db.starters[k] != null ? previewPlan.db.starters[k] : BASE_PHASES[0].weights[k])} кг × 2×{(EX_BY_KEY[k].type === "big" ? "12–15" : "10–12")}</b>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
                <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
              </div>
            )}
          </div>
        </div>
      );
    }

    /* ================= Профиль ================= */
    function ProfileTab({ profile, week, completedCount, workoutsDone, soundOn, setSoundOn, onRequestReset, len = 21 }) {
      const tgUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
      const name = (profile && profile.name) || (tgUser && tgUser.first_name) || "Спортсмен";
      const initial = (name[0] || "Н").toUpperCase();
      const phase = getPhaseForWeek(week);

      const equipNames = (profile && profile.equip && profile.equip.length)
        ? profile.equip.map((id) => { const f = EQUIPMENT.find((e) => e[0] === id); return f ? f[1].toLowerCase() : id; }).join(" · ")
        : "гантели";

      let dbLine = null;
      if (profile && profile.db && typeof profile.db.handle !== "undefined") {
        const parts = Object.keys(profile.db.counts || {}).map((p) => `${p}×${profile.db.counts[p]}`);
        dbLine = `ручка ${profile.db.handle} кг` + (parts.length ? ` · диски ${parts.join(", ")}` : "");
      }

      return (
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginTop: 6 }}>
            <div style={{ width: 46, height: 46, borderRadius: "50%", background: C.accent, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 900, fontSize: 17 }}>{initial}</div>
            <div>
              <div style={{ fontWeight: 900, fontSize: 16 }}>{name}</div>
              <div style={{ fontSize: 12, color: C.textMuted }}>Неделя {week} из {len} · Этап {phase.id}</div>
            </div>
          </div>

          <div style={{ background: "linear-gradient(135deg, rgba(192,57,43,.2), " + C.surface + ")", border: `1px solid ${C.accentSoft}`, borderRadius: 14, padding: 14, display: "flex", alignItems: "center", gap: 14, marginTop: 14 }}>
            <div style={{ fontSize: 30, fontWeight: 900, lineHeight: 1 }}>{completedCount}<span style={{ fontSize: 13, color: C.textMuted }}>/{len}</span></div>
            <div style={{ fontSize: 12.5, color: C.textMuted, lineHeight: 1.45 }}>
              <b style={{ color: C.text }}>недель пройдено</b><br />
              тренировок закрыто: {workoutsDone}
            </div>
          </div>

          <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 14, marginTop: 12 }}>
            <div style={{ fontSize: 13, fontWeight: 800, marginBottom: 10 }}>Моя программа</div>
            <div style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: `1px solid ${C.border}`, fontSize: 13, color: C.textMuted }}>
              <span>Оборудование</span><b style={{ color: C.text }}>{equipNames}</b>
            </div>
            {dbLine && (
              <div style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: `1px solid ${C.border}`, fontSize: 12.5, color: C.textMuted }}>
                <span>Гантели</span><b style={{ color: C.text, textAlign: "right" }}>{dbLine}</b>
              </div>
            )}
            {(profile && profile.muscles && profile.muscles.length > 0) && (
              <div style={{ paddingTop: 10 }}>
                <div style={{ fontSize: 11.5, color: C.textFaint, marginBottom: 6 }}>Целевые мышцы</div>
                <div className="chipsbar">
                  {profile.muscles.map((mid) => {
                    const mm = MUSCLES.find((x) => x.id === mid);
                    return mm ? (
                      <span key={mid} style={{ fontSize: 11, fontWeight: 700, color: C.textMuted, border: `1px solid ${C.border}`, borderRadius: 999, padding: "4px 10px" }}>{mm.n}</span>
                    ) : null;
                  })}
                </div>
              </div>
            )}
          </div>

          <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 14, marginTop: 12 }}>
            <div style={{ fontSize: 13, fontWeight: 800, marginBottom: 6 }}>Настройки</div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "11px 0", borderBottom: `1px solid ${C.border}`, fontSize: 13, color: C.textMuted }}>
              <span>🔊 Звук таймера</span>
              <button onClick={() => { setSoundOn(!soundOn); triggerHaptic("selection"); }}
                      style={{ width: 38, height: 21, borderRadius: 999, background: soundOn ? C.done : C.textFaint, border: "none", position: "relative", cursor: "pointer" }}>
                <span style={{ position: "absolute", top: 2, right: soundOn ? 2 : 20, width: 17, height: 17, borderRadius: "50%", background: "#fff", transition: "all 150ms" }} />
              </button>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "11px 0", fontSize: 13, color: C.accent, fontWeight: 800, cursor: "pointer" }}
                 onClick={onRequestReset}>
              <span>Сбросить прогресс</span><span>›</span>
            </div>
          </div>

          <div style={{ textAlign: "center", marginTop: 18, fontSize: 11, color: C.textFaint }}>
            NeuroFit v2 · данные синхронизируются через Telegram Cloud
          </div>
        </div>
      );
    }

    /* ================= Главное приложение ================= */
    function App() {
      const [loaded, setLoaded] = useState(false);
      const [onboarded, setOnboarded] = useState(false);

      const [tab, setTab] = useState("train");
      const [week, setWeek] = useState(1);
      const [overrides, setOverrides] = useState({});
      const [checksByWeek, setChecksByWeek] = useState({});
      const [bodyWeightLog, setBodyWeightLog] = useState({});
      const [photoWeeks, setPhotoWeeks] = useState([]);
      const [completedWeeks, setCompletedWeeks] = useState({});
      const [profile, setProfile] = useState({ equip: ["db"], muscles: [], sound: true });
      const [plan, setPlan] = useState(null);

      const [currentPhotoUrl, setCurrentPhotoUrl] = useState(null);
      const [photoBusy, setPhotoBusy] = useState(false);
      const [modalExercise, setModalExercise] = useState(null);
      const [previewImage, setPreviewImage] = useState(null);
      const [confirmReset, setConfirmReset] = useState(false);
      const [weightIncreasedMsg, setWeightIncreasedMsg] = useState("");

      const [dayAnim, setDayAnim] = useState(null);   // {stage:'flash'|'collapse'|'toast'|'opening', idx}
      const [weekOverlay, setWeekOverlay] = useState(null); // {from,to,increased}
      const advancingRef = useRef(false);
      const animTimersRef = useRef([]);

      const clearAnimTimers = () => { animTimersRef.current.forEach(clearTimeout); animTimersRef.current = []; };
      const later = (fn, ms) => { animTimersRef.current.push(setTimeout(fn, ms)); };

      /* ---------- загрузка ---------- */
      useEffect(() => {
        (async () => {
          const saved = await loadStateStorage();
          if (saved) {
            setOnboarded(true);
            const initialWeek = saved.week || 1;
            setWeek(initialWeek);
            let cleanOverrides = saved.overrides || {};
            if (!saved.schemaVersion || saved.schemaVersion < 4) cleanOverrides = {};
            setOverrides(cleanOverrides);

            let initialChecksByWeek = saved.checksByWeek || {};
            if (saved.checks && Object.keys(saved.checks).length > 0 && !saved.checksByWeek) {
              initialChecksByWeek[initialWeek] = saved.checks;
            }

            // Чиним рассинхрон completedWeeks: убираем недели, которые не реально завершены
            const cw = { ...(saved.completedWeeks || {}) };
            Object.keys(cw).forEach((wKey) => {
              const wNum = Number(wKey);
              const ph = getPhaseForWeek(wNum);
              const list = workoutFor(ph, wNum, cleanOverrides, saved.plan || null);
              const wc = initialChecksByWeek[wNum];
              const done = !!wc && DAYS.every((d) => wc[d.key] && list.every((ex) => {
                const arr = Array.isArray(wc[d.key][ex.key]) ? wc[d.key][ex.key] : [Boolean(wc[d.key][ex.key])];
                return arr.every(Boolean);
              }));
              if (!done) delete cw[wKey];
            });

            setChecksByWeek(initialChecksByWeek);
            setBodyWeightLog(saved.bodyWeightLog || {});
            setPhotoWeeks(saved.photoWeeks || []);
            setCompletedWeeks(cw);
            setPlan(saved.plan || null);
            setProfile(saved.profile || { equip: ["db"], muscles: [], sound: true });

            // Поддержка /reset из самого Telegram: бот открывает WebApp с параметром reset
            try {
              const sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
              if (sp === "reset" || sp === "restart") setConfirmReset(true);
            } catch (e) {}
          }
          setLoaded(true);
        })();
        return clearAnimTimers;
      }, []);

      /* ---------- сохранение ---------- */
      useEffect(() => {
        if (!loaded || !onboarded) return;
        saveStateStorage({
          schemaVersion: 6, week, overrides, checksByWeek, bodyWeightLog,
          photoWeeks, completedWeeks, profile, plan,
        });
      }, [loaded, onboarded, week, overrides, checksByWeek, bodyWeightLog, photoWeeks, completedWeeks, profile, plan]);

      useEffect(() => {
        if (loaded && onboarded) getPhotoLocal(week).then(setCurrentPhotoUrl);
      }, [week, loaded, onboarded]);

      const phase = getPhaseForWeek(week);
      const len = progLen(plan);
      const soundOn = !(profile && profile.sound === false);

      const curList = useMemo(() => workoutFor(phase, week, overrides, plan), [phase, week, overrides, plan]);

      const currentChecks = useMemo(() => {
        if (checksByWeek[week]) return checksByWeek[week];
        return emptyChecksForWeek(phase, week, overrides, plan);
      }, [checksByWeek, week, phase, overrides, plan]);

      const checkIsWeekDone = useCallback((targetWeek, checksData) => {
        const ph = getPhaseForWeek(targetWeek);
        const list = workoutFor(ph, targetWeek, overrides, plan);
        const wChecks = (checksData || {})[targetWeek];
        if (!wChecks) return false;
        return DAYS.every((d) => wChecks[d.key] && list.every((ex) => {
          const arr = Array.isArray(wChecks[d.key][ex.key]) ? wChecks[d.key][ex.key] : [Boolean(wChecks[d.key][ex.key])];
          return arr.every(Boolean);
        }));
      }, [overrides, plan]);

      const isCurrentWeekDone = useMemo(() => checkIsWeekDone(week, checksByWeek) || !!completedWeeks[week],
        [week, checksByWeek, completedWeeks, checkIsWeekDone]);

      const isWeekLocked = useMemo(() => {
        if (week <= 1) return false;
        return !checkIsWeekDone(week - 1, checksByWeek) && !completedWeeks[week - 1];
      }, [week, checksByWeek, completedWeeks, checkIsWeekDone]);

      // Завершённые недели — read-only (кроме текущей активной)
      const firstIncompleteWeek = useMemo(() => {
        const len = progLen(plan);
        for (let w = 1; w <= len; w++) if (!completedWeeks[w]) return w;
        return 21;
      }, [completedWeeks]);
      const readOnlyView = !!completedWeeks[week] && week !== firstIncompleteWeek;
      const interactionsDisabled = isWeekLocked || readOnlyView;

      const completedCount = Object.keys(completedWeeks).length;

      // Ключи упражнений плана (для подсчёта тренировок по всем неделям — полный план программы)
      const planKeysAll = useMemo(() => {
        const keys = plan && plan.keys && plan.keys.length ? plan.keys : EXERCISES.map((e) => e.key);
        return ["warmup", ...keys, "plank"];
      }, [plan]);

      const workoutsDone = useMemo(() => {
        let n = 0;
        Object.values(checksByWeek).forEach((wc) => {
          DAYS.forEach((d) => {
            const c = wc[d.key];
            if (c && planKeysAll.every((k) => {
              const arr = c[k];
              return Array.isArray(arr) ? arr.every(Boolean) : Boolean(arr);
            })) n++;
          });
        });
        return n;
      }, [checksByWeek, planKeysAll]);

      /* ---------- авто-переход недели (оверлей) ---------- */
      const commitAdvance = useCallback((fromWeek) => {
        const nextWeek = fromWeek + 1;
        const fromPhase = getPhaseForWeek(fromWeek);
        const nextPhase = getPhaseForWeek(nextWeek);
        const increased = nextPhase.weights.squat > fromPhase.weights.squat || nextPhase.weights.ohp > fromPhase.weights.ohp;

        setCompletedWeeks((prev) => ({ ...prev, [fromWeek]: new Date().toISOString() }));
        setWeekOverlay({ from: fromWeek, to: nextWeek, increased });

        later(() => {
          setWeek(nextWeek);
          setChecksByWeek((prev) => {
            if (prev[nextWeek]) return prev;
            return { ...prev, [nextWeek]: emptyChecksForWeek(getPhaseForWeek(nextWeek), nextWeek, overrides, plan) };
          });
          setWeightIncreasedMsg(increased ? `💪 Неделя ${nextWeek}: веса увеличены! Проверьте новые значения.` : "");
          triggerHaptic(increased ? "warning" : "success");
        }, 2600);
        later(() => setWeekOverlay(null), 3150);
        later(() => { advancingRef.current = false; }, 3300);
      }, [overrides, plan]);

      /* ---------- анимация завершения дня ---------- */
      const startDayAnim = useCallback((dayIdx) => {
        setDayAnim({ stage: "flash", idx: dayIdx });
        later(() => setDayAnim({ stage: "collapse", idx: dayIdx }), 900);
        later(() => setDayAnim({ stage: "toast", idx: dayIdx }), 1150);
        if (dayIdx < DAYS.length - 1) {
          later(() => setDayAnim({ stage: "opening", idx: dayIdx + 1 }), 2900);
          later(() => setDayAnim(null), 4400);
        } else {
          later(() => setDayAnim(null), 2900);
        }
      }, []);

      const dayIsDone = useCallback((dayKey, checksData) => {
        const c = (checksData || {})[dayKey];
        if (!c) return false;
        return curList.every((ex) => {
          const arr = c[ex.key];
          return Array.isArray(arr) ? arr.every(Boolean) : Boolean(arr);
        });
      }, [curList]);

      const toggleSet = useCallback((dayKey, exKey, idx) => {
        if (advancingRef.current || interactionsDisabled) return;
        const beforeDone = dayIsDone(dayKey, currentChecks);
        const beforeWeekDone = checkIsWeekDone(week, checksByWeek);

        const nextWeekChecks = JSON.parse(JSON.stringify(checksByWeek[week] || emptyChecksForWeek(phase, week, overrides, plan)));
        if (!nextWeekChecks[dayKey]) nextWeekChecks[dayKey] = {};
        if (!Array.isArray(nextWeekChecks[dayKey][exKey])) {
          nextWeekChecks[dayKey][exKey] = [Boolean(nextWeekChecks[dayKey][exKey])];
        }
        while (nextWeekChecks[dayKey][exKey].length <= idx) nextWeekChecks[dayKey][exKey].push(false);
        nextWeekChecks[dayKey][exKey][idx] = !nextWeekChecks[dayKey][exKey][idx];

        const nextChecksByWeek = { ...checksByWeek, [week]: nextWeekChecks };
        setChecksByWeek(nextChecksByWeek);

        const afterDone = dayIsDone(dayKey, nextWeekChecks);
        const afterWeekDone = checkIsWeekDone(week, nextChecksByWeek);

        if (afterWeekDone && !beforeWeekDone && week < len) {
          advancingRef.current = true;
          later(() => commitAdvance(week), 650);
        } else if (afterDone && !beforeDone) {
          const dayIdx = DAYS.findIndex((d) => d.key === dayKey);
          startDayAnim(dayIdx);
        }
      }, [week, checksByWeek, phase, overrides, plan, currentChecks, dayIsDone, checkIsWeekDone, interactionsDisabled, startDayAnim, commitAdvance]);

      const toggleAll = useCallback((dayKey, value) => {
        if (advancingRef.current || interactionsDisabled) return;
        const beforeDone = dayIsDone(dayKey, currentChecks);
        const beforeWeekDone = checkIsWeekDone(week, checksByWeek);

        const nextWeekChecks = JSON.parse(JSON.stringify(checksByWeek[week] || emptyChecksForWeek(phase, week, overrides, plan)));
        if (!nextWeekChecks[dayKey]) return;
        curList.forEach((ex) => {
          nextWeekChecks[dayKey][ex.key] = Array.from({ length: ex.sets }, () => value);
        });
        const nextChecksByWeek = { ...checksByWeek, [week]: nextWeekChecks };
        setChecksByWeek(nextChecksByWeek);

        const afterDone = dayIsDone(dayKey, nextWeekChecks);
        const afterWeekDone = checkIsWeekDone(week, nextChecksByWeek);

        if (value && afterWeekDone && !beforeWeekDone && week < len) {
          advancingRef.current = true;
          later(() => commitAdvance(week), 650);
        } else if (value && afterDone && !beforeDone) {
          const dayIdx = DAYS.findIndex((d) => d.key === dayKey);
          startDayAnim(dayIdx);
        }
      }, [week, checksByWeek, phase, overrides, plan, curList, currentChecks, dayIsDone, checkIsWeekDone, interactionsDisabled, startDayAnim, commitAdvance]);

      const changeBodyWeight = useCallback((val) => {
        setBodyWeightLog((prev) => { const next = { ...prev }; if (val == null) delete next[week]; else next[week] = val; return next; });
      }, [week]);

      const pickPhoto = useCallback(async (file) => {
        setPhotoBusy(true);
        try {
          const dataUrl = await compressImage(file);
          await savePhotoLocal(week, dataUrl);
          setCurrentPhotoUrl(dataUrl);
          setPhotoWeeks((prev) => (prev.includes(week) ? prev : [...prev, week].sort((a, b) => a - b)));
        } finally { setPhotoBusy(false); }
      }, [week]);

      const doResetAll = () => {
        setWeek(1); setOverrides({}); setChecksByWeek({}); setBodyWeightLog({});
        setPhotoWeeks([]); setCurrentPhotoUrl(null); setCompletedWeeks({});
        setWeightIncreasedMsg("");
        // Полный перезапуск: профиль и план заново, старт с анкеты
        setPlan(null);
        setProfile({ equip: ["db"], muscles: [], sound: true });
        setOnboarded(false);
        clearAnimTimers();
        advancingRef.current = false;
        setDayAnim(null); setWeekOverlay(null);
        window.scrollTo({ top: 0 });
      };

      const nudgeWeek = (delta) => {
        const len = progLen(plan);
        const w = Math.max(1, Math.min(len, week + delta));
        setWeek(w);
        setWeightIncreasedMsg("");
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const finishOnboarding = useCallback(({ profile: p, plan: pl }) => {
        setProfile({ ...p, sound: true });
        setPlan(pl);
        setWeek(1);
        setChecksByWeek({ 1: emptyChecksForWeek(getPhaseForWeek(1), 1, {}, pl) });
        setCompletedWeeks({});
        setOnboarded(true);
        setTab("train");
      }, []);

      if (!loaded) {
        return <div style={{ background: C.bg, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: C.textMuted, fontSize: 16 }}>Загрузка трекера…</div>;
      }

      if (!onboarded) {
        return <Onboarding onDone={finishOnboarding} />;
      }

      const allDaysStatuses = DAYS.map((dayInfo) => {
        const c = currentChecks[dayInfo.key];
        return !!c && curList.every((ex) => {
          const arr = c[ex.key];
          return Array.isArray(arr) ? arr.every(Boolean) : Boolean(arr);
        });
      });
      const firstUndoneIndex = allDaysStatuses.indexOf(false);

      const toastDayIdx = dayAnim && dayAnim.stage === "toast" ? dayAnim.idx : null;

      return (
        <div style={{ background: C.bg, minHeight: "100vh", color: C.text, paddingBottom: "calc(96px + env(safe-area-inset-bottom))" }}>
          {/* ======== ТАБ: ТРЕНИРОВКА ======== */}
          {tab === "train" && (
            <div style={{ maxWidth: 600, margin: "0 auto", padding: "16px 14px 0" }}>
              <WeekNavigationHeader week={week} maxWeeks={len} onNudge={nudgeWeek} isCompleted={isCurrentWeekDone} isLocked={isWeekLocked} />

              <PlateBadge week={week} phase={phase} currentChecks={currentChecks} overrides={overrides} plan={plan} completedCount={completedCount} />

              <div style={{ textAlign: "center", marginBottom: 16 }}>
                <div style={{ fontSize: 12.5, color: C.textMuted }}>Нажмите ⓘ на упражнении для просмотра анимации техники.</div>
                {weightIncreasedMsg && !weekOverlay && (
                  <div style={{ marginTop: 10, padding: "8px 14px", background: "rgba(192,57,43,0.15)", border: `1px solid ${C.accent}`, borderRadius: 8, fontSize: 13.5, color: "#fff", fontWeight: 700 }}>
                    {weightIncreasedMsg}
                  </div>
                )}
                {readOnlyView && (
                  <div style={{ marginTop: 10, padding: "8px 14px", background: "rgba(76,154,107,0.12)", border: `1px solid ${C.done}`, borderRadius: 8, fontSize: 13, color: C.done, fontWeight: 700 }}>
                    🔒 Эта неделя уже завершена и открыта только для просмотра
                  </div>
                )}
              </div>

              {isWeekLocked && (
                <div style={{ background: "rgba(230,126,34,0.12)", border: "1px solid #E67E22", borderRadius: 12, padding: "14px 16px", marginBottom: 16, textAlign: "center" }}>
                  <div style={{ fontSize: 16, marginBottom: 4 }}>🔒</div>
                  <div style={{ fontSize: 14, fontWeight: 800, color: "#E67E22", marginBottom: 2 }}>Неделя заблокирована</div>
                  <div style={{ fontSize: 12.5, color: C.textMuted }}>
                    Чтобы открыть тренировки Недели {week}, сначала завершите все 3 дня Недели {week - 1}.
                  </div>
                </div>
              )}

              {DAYS.map((d, index) => {
                const shouldBeOpen = firstUndoneIndex === -1 ? (index === 0) : (index === firstUndoneIndex);
                let animStage = null;
                if (dayAnim) {
                  if (dayAnim.idx === index) animStage = dayAnim.stage === "toast" ? null : dayAnim.stage;
                  if (dayAnim.stage === "opening" && dayAnim.idx === index) animStage = "opening";
                }
                return (
                  <DayCard key={`${week}-${d.key}`} day={d} index={index} phase={phase} week={week} overrides={overrides} plan={plan}
                    checksForDay={currentChecks[d.key]} onToggleSet={toggleSet} onToggleAll={toggleAll}
                    bodyWeight={bodyWeightLog[week] ?? null} onBodyWeightChange={changeBodyWeight}
                    currentPhotoUrl={currentPhotoUrl} onPhotoPick={pickPhoto} photoBusy={photoBusy}
                    onOpenInfo={setModalExercise} defaultOpen={shouldBeOpen} onPreviewImage={setPreviewImage}
                    isLocked={isWeekLocked} readOnly={readOnlyView} animStage={animStage} soundOn={soundOn} />
                );
              })}

              <Roadmap currentWeek={week} overrides={overrides} plan={plan} />

              <div style={{ marginTop: 20, paddingTop: 14, borderTop: `1px solid ${C.border}`, display: "flex", gap: 10, flexWrap: "wrap", justifyContent: "center" }}>
                <button onClick={() => nudgeWeek(-1)} disabled={week <= 1} className="ghostBtnCls"
                        style={{ opacity: week <= 1 ? 0.3 : 1, cursor: week <= 1 ? "not-allowed" : "pointer" }}>
                  ‹ Неделя {Math.max(1, week - 1)}
                </button>
                <span style={{ color: C.textFaint }}>•</span>
                <button onClick={() => nudgeWeek(1)} disabled={week >= len} className="ghostBtnCls"
                        style={{ opacity: week >= len ? 0.3 : 1, cursor: week >= len ? "not-allowed" : "pointer" }}>
                  Неделя {Math.min(len, week + 1)} ›
                </button>
              </div>
              <style>{`.ghostBtnCls{background:none;border:none;color:${C.textMuted};font-size:12.5px;cursor:pointer;padding:4px 6px;text-decoration:underline;text-underline-offset:3px;}`}</style>
            </div>
          )}

          {/* ======== ТАБ: ПРОГРЕСС ======== */}
          {tab === "progress" && (
            <div style={{ maxWidth: 600, margin: "0 auto", padding: "16px 14px 0" }}>
              <Roadmap currentWeek={week} overrides={overrides} plan={plan} />
              <ProgressPanel week={week} overrides={overrides} plan={plan} bodyWeightLog={bodyWeightLog}
                             photoWeeks={photoWeeks} completedWeeks={completedWeeks} onPreviewImage={setPreviewImage} />
            </div>
          )}

          {/* ======== ТАБ: ПРОФИЛЬ ======== */}
          {tab === "profile" && (
            <div style={{ maxWidth: 600, margin: "0 auto", padding: "16px 14px 0" }}>
              <ProfileTab profile={profile} week={week} completedCount={completedCount} workoutsDone={workoutsDone}
                          soundOn={soundOn} setSoundOn={(v) => setProfile((p) => ({ ...p, sound: v }))}
                          onRequestReset={() => setConfirmReset(true)} len={len} />
            </div>
          )}

          {/* Нижняя навигация */}
          <div style={{
            position: "fixed", left: 0, right: 0, bottom: 0, zIndex: 500,
            background: "rgba(21,18,15,.97)", borderTop: `1px solid ${C.border}`,
            display: "flex", padding: "10px 6px calc(12px + env(safe-area-inset-bottom))"
          }}>
            {[
              ["train", "🏋️", "Тренировка"],
              ["progress", "📈", "Прогресс"],
              ["profile", "👤", "Профиль"],
            ].map(([id, icon, label]) => (
              <button key={id} onClick={() => { setTab(id); triggerHaptic("selection"); }}
                      style={{ flex: 1, background: "none", border: "none", cursor: "pointer", padding: "4px 0" }}>
                <span style={{ fontSize: 18, display: "block", marginBottom: 3, filter: tab === id ? "none" : "grayscale(1) opacity(.55)" }}>{icon}</span>
                <span style={{ fontSize: 10.5, fontWeight: 700, color: tab === id ? C.accent : C.textFaint }}>{label}</span>
              </button>
            ))}
          </div>

          {/* Оверлеи и модалки */}
          <DayToast dayLabel={toastDayIdx != null ? DAYS[toastDayIdx].label : null}
                    nextLabel={toastDayIdx != null && DAYS[toastDayIdx + 1] ? DAYS[toastDayIdx + 1].label : null} />
          <WeekOverlay data={weekOverlay} />
          <InfoModal exercise={modalExercise} onClose={() => setModalExercise(null)} />
          <ImageModal src={previewImage} onClose={() => setPreviewImage(null)} />
          <ConfirmModal
            title="Сбросить всё с нуля?"
            text="Будут удалены отметки, веса, вес тела и завершённые недели — и запустится анкета настройки заново. Фото на устройстве останутся. Действие необратимо."
            confirmLabel="Сбросить" danger
            onConfirm={doResetAll}
            onClose={() => setConfirmReset(false)}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
