<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#15120F">
  <title>NeuroFit Трекер v2</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- React (пины версий) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <!-- Реальные SVG тела для онбординга (загрузи bodies.js рядом с этим файлом).
       Если файла нет — карта рисует встроенную заглушку, ничего не ломается. -->
  <script src="./bodies.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #15120F;
      color: #F2EDE7;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    button, input { font: inherit; }

    /* ===== Анимации переходов день/неделя ===== */
    @keyframes nfSlam{
      0%{transform:scale(2.1) rotate(14deg);opacity:0}
      55%{transform:scale(.94) rotate(-3deg);opacity:1}
      100%{transform:scale(1) rotate(0)}
    }
    @keyframes nfRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes nfFall{to{transform:translateY(440px) rotate(680deg);opacity:.15}}
    @keyframes nfPulse{
      0%,100%{box-shadow:0 0 0 rgba(41,128,185,0)}
      40%{box-shadow:0 0 26px rgba(41,128,185,.55)}
    }
    @keyframes nfFlash{
      0%{box-shadow:0 0 0 rgba(76,154,107,0)}
      35%{box-shadow:0 0 28px rgba(76,154,107,.5)}
      100%{box-shadow:0 0 20px rgba(76,154,107,.32)}
    }
    @keyframes nfPop{0%{transform:scale(.5)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
    @keyframes nfToastIn{
      0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}
      14%{opacity:1;transform:translate(-50%,-50%) scale(1)}
      86%{opacity:1;transform:translate(-50%,-50%) scale(1)}
      100%{opacity:0;transform:translate(-50%,-50%) scale(.95)}
    }
    .nf-slam{animation:nfSlam .55s cubic-bezier(.2,1.3,.35,1) both}
    .nf-rise{animation:nfRise .45s both}
    .nf-pulse{animation:nfPulse 1.4s ease}
    .nf-flash{animation:nfFlash .6s ease both}
    .nf-pop{animation:nfPop .4s cubic-bezier(.2,1.8,.4,1)}
    .nf-toast{animation:nfToastIn 1.7s ease both}

    /* Карта тела */
    #bodymap-wrap svg{color:#7D7266}
    #bodymap-wrap [id="body"] path,#bodymap-wrap [id="body"] line{stroke:#87796B}
    #bodymap-wrap svg g[id]{cursor:pointer;transition:filter .15s}
    #bodymap-wrap svg g[id]:hover{filter:brightness(1.35)}
    #bodymap-wrap .hidden{display:none}
    .bmcell svg{width:124px;height:auto;display:block;margin:0 auto}
    .chipsbar{display:flex;flex-wrap:wrap;gap:8px}
    @media (max-width: 360px) {
      body { font-size: 15px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    /* ================= Telegram init + тема ================= */
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.setHeaderColor("#15120F"); } catch (e) {}
      try { tg.setBackgroundColor("#15120F"); } catch (e) {}
    }

    function triggerHaptic(type = "light") {
      try {
        if (tg && tg.HapticFeedback) {
          if (type === "success" || type === "warning" || type === "error") {
            tg.HapticFeedback.notificationOccurred(type);
          } else {
            tg.HapticFeedback.impactOccurred(type);
          }
        }
      } catch (e) {}
    }

    /* ================= Звук окончания отдыха (WebAudio-чим вместо TTS) ================= */
    let audioCtx = null;
    function playChime() {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const t = audioCtx.currentTime;
        [[880, 0], [1318.5, 0.13]].forEach(([freq, d]) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = "sine"; o.frequency.value = freq;
          g.gain.setValueAtTime(0.0001, t + d);
          g.gain.exponentialRampToValueAtTime(0.22, t + d + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.38);
          o.connect(g); g.connect(audioCtx.destination);
          o.start(t + d); o.stop(t + d + 0.42);
        });
      } catch (e) {}
    }

    /* ================= IndexedDB для фото ================= */
    const DB_NAME = "NeuroFitPhotosDB";
    function openPhotoDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("photos")) {
            db.createObjectStore("photos", { keyPath: "week" });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function savePhotoLocal(week, dataUrl) {
      try {
        const db = await openPhotoDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction("photos", "readwrite");
          tx.objectStore("photos").put({ week, dataUrl });
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(false);
        });
      } catch (e) { return false; }
    }
    async function getPhotoLocal(week) {
      try {
        const db = await openPhotoDB();
        return new Promise((resolve) => {
          const tx = db.transaction("photos", "readonly");
          const req = tx.objectStore("photos").get(week);
          req.onsuccess = () => resolve(req.result ? req.result.dataUrl : null);
          req.onerror = () => resolve(null);
        });
      } catch (e) { return null; }
    }

    /* ================= Storage (тот же ключ — прогресс сохраняется!) ================= */
    const STATE_KEY = "neurofit_state_v2";
    function loadStateStorage() {
      return new Promise((resolve) => {
        if (tg && tg.CloudStorage) {
          tg.CloudStorage.getItem(STATE_KEY, (err, val) => {
            if (!err && val) {
              try { return resolve(JSON.parse(val)); } catch (e) {}
            }
            fallbackLocal();
          });
        } else fallbackLocal();
        function fallbackLocal() {
          try {
            const val = localStorage.getItem(STATE_KEY);
            if (val) return resolve(JSON.parse(val));
          } catch (e) {}
          resolve(null);
        }
      });
    }
    function saveStateStorage(state) {
      const str = JSON.stringify(state);
      try { localStorage.setItem(STATE_KEY, str); } catch (e) {}
      if (tg && tg.CloudStorage) {
        try { tg.CloudStorage.setItem(STATE_KEY, str); } catch (e) {}
      }
    }

    /* ================= Программа: фазы и веса (без изменений) ================= */
    const BASE_PHASES = [
      { id: 1, label: "Старт и техника", weeks: [1, 2], sets: { big: 2, iso: 2 },
        weights: { squat: 7.5, rdl: 7.5, row: 7.5, floor: 7.5, ohp: 5, curl: 5, tricep: 5 }, plankSec: 25 },
      { id: 2, label: "Полный объём", weeks: [3, 4, 5], sets: { big: 3, iso: 2 },
        weights: { squat: 7.5, rdl: 7.5, row: 7.5, floor: 7.5, ohp: 5, curl: 5, tricep: 5 }, plankSec: 30 },
      { id: 3, label: "Первое повышение", weeks: [6, 7, 8], sets: { big: 3, iso: 2 },
        weights: { squat: 8.5, rdl: 8.5, row: 8.5, floor: 8.5, ohp: 6, curl: 6, tricep: 6 }, plankSec: 40 },
      { id: 4, label: "Силовой блок", weeks: [9, 10, 11], sets: { big: 3, iso: 2 },
        weights: { squat: 11, rdl: 11, row: 11, floor: 11, ohp: 6, curl: 6, tricep: 6 }, plankSec: 45 },
      { id: 5, label: "Разгрузочная неделя", weeks: [12], sets: { big: 2, iso: 1 },
        weights: { squat: 7.5, rdl: 7.5, row: 7.5, floor: 7.5, ohp: 5, curl: 5, tricep: 5 }, plankSec: 30 },
      { id: 6, label: "Рост после разгрузки", weeks: [13, 14, 15], sets: { big: 3, iso: 2 },
        weights: { squat: 11, rdl: 11, row: 11, floor: 11, ohp: 7.5, curl: 7.5, tricep: 7.5 }, plankSec: 50 },
      { id: 7, label: "Закрепляем силу", weeks: [16, 17, 18], sets: { big: 3, iso: 2 },
        weights: { squat: 12, rdl: 12, row: 12, floor: 12, ohp: 7.5, curl: 7.5, tricep: 7.5 }, plankSec: 55 },
      { id: 8, label: "Финальный блок", weeks: [19, 20, 21], sets: { big: 3, iso: 2 },
        weights: { squat: 12, rdl: 12, row: 12, floor: 12, ohp: 8.5, curl: 8.5, tricep: 8.5 }, plankSec: 60 },
    ];

    function round1(v) { return Math.round(v * 10) / 10; }
    function getPhaseForWeek(week) {
      const found = BASE_PHASES.find((ph) => week >= ph.weeks[0] && week <= ph.weeks[ph.weeks.length - 1]);
      return found || BASE_PHASES[BASE_PHASES.length - 1];
    }
    function baseNumeric(phase, key) {
      const v = phase.weights[key];
      return typeof v === "number" ? v : 0;
    }
    function effectiveWeight(key, week, overrides) {
      const phase = getPhaseForWeek(week);
      const list = (overrides && overrides[key]) || {};
      const weeks = Object.keys(list).map(Number).filter((w) => w <= week);
      if (weeks.length === 0) return phase.weights[key];
      const overrideWeek = Math.max(...weeks);
      const overrideVal = list[overrideWeek];
      if (overrideVal > 30 || overrideVal < 3) return phase.weights[key];
      const delta = overrideVal - baseNumeric(getPhaseForWeek(overrideWeek), key);
      return round1(baseNumeric(phase, key) + delta);
    }
    function discSetup(weight, singleDumbbell = false) {
      const variants = {
        5: "по 1 диску 1.25 кг с каждой стороны",
        6: "по 1 диску 3 кг с каждой стороны",
        7.5: "по 1 диску 2.5 кг + 1.25 кг с каждой стороны",
        8.5: "по 1 диску 3 кг + 1.25 кг с каждой стороны",
        11: "по 1 диску 3 кг + 2.5 кг с каждой стороны",
        12: "по 2 диска 3 кг с каждой стороны",
      };
      const prefix = singleDumbbell ? "на одну гантель: " : "на каждую гантель: ";
      return variants[weight] ? prefix + variants[weight] : `${prefix}соберите ${weight} кг`;
    }

    /* ================= База упражнений (гантели) ================= */
    const EXERCISES = [
      { key: "squat", name: "Приседания с гантелями", reps: "12–15 повторов", type: "big", restSec: 90,
        gif: "./gifs/squat.gif",
        tip: "Держи гантели в опущенных руках или у плеч. Спина прямая, таз отводи назад, приседай до параллели бедра с полом.",
        discSetup: (w) => discSetup(w) },
      { key: "rdl", name: "Румынская тяга с гантелями", reps: "10–12 повторов", type: "big", restSec: 90,
        gif: "./gifs/rdl.gif",
        tip: "Гантели скользят вдоль ног. Мягко согни колени, отводи таз назад и держи спину ровной; почувствуй растяжение задней поверхности бедра.",
        discSetup: (w) => discSetup(w) },
      { key: "row", name: "Тяга гантели в наклоне", reps: "10–12 повторов", type: "big", restSec: 90,
        gif: "./gifs/row.gif",
        tip: "Опрись коленом и рукой на диван/стул. Корпус параллелен полу. Тяни гантель к поясу, ощущая сжатие лопатки.",
        discSetup: (w) => discSetup(w) },
      { key: "floor", name: "Жим гантелей лёжа на полу", reps: "10–12 повторов", type: "big", restSec: 90,
        gif: "./gifs/floor.gif",
        tip: "Лёжа на спине на коврике, ноги согнуты. Локти под углом 45° к корпусу, выжимай гантели вверх над грудью.",
        discSetup: (w) => discSetup(w) },
      { key: "ohp", name: "Жим гантелей стоя над головой", reps: "10–12 повторов", type: "big", restSec: 75,
        gif: "./gifs/ohp.gif",
        tip: "Стоя, пресс и ягодицы напряжены. Выжимай гантели вверх от плеч над головой, не прогибая поясницу.",
        discSetup: (w) => discSetup(w) },
      { key: "curl", name: "Сгибания на бицепс", reps: "12–15 повторов", type: "iso", restSec: 60,
        gif: "./gifs/curl.gif",
        tip: "Стоя, локти зафиксированы у туловища. Поднимай гантели плавным движением, разворачивая кисти к себе.",
        discSetup: (w) => discSetup(w) },
      { key: "tricep", name: "Разгибание на трицепс", reps: "12–15 повторов", type: "iso", restSec: 60,
        gif: "./gifs/tricep.gif",
        tip: "Возьми 1 гантель ОБЕИМИ руками за блин, подняв над головой. Опускай за голову и полностью разгибай вверх.",
        discSetup: (w) => discSetup(w, true) },
    ];
    const EX_BY_KEY = {};
    EXERCISES.forEach((e) => { EX_BY_KEY[e.key] = e; });

    const MUSCLE_OF_EX = {
      squat: ["quads", "glutes"],
      rdl: ["hamstrings", "glutes", "lowerback"],
      row: ["lats", "traps-middle", "rear-shoulders", "biceps"],
      floor: ["chest", "front-shoulders", "triceps"],
      ohp: ["front-shoulders", "triceps"],
      curl: ["biceps"],
      tricep: ["triceps"],
    };

    /* ================= Движок весов под блины пользователя ================= */
    const DB_STARTERS = { squat: 7.5, rdl: 7.5, row: 7.5, floor: 7.5, ohp: 5, curl: 5, tricep: 5 };
    const PLATE_TYPES = [1.25, 2.5, 5];

    function pluralRu(n, forms) {
      const m10 = n % 10, m100 = n % 100;
      if (m10 === 1 && m100 !== 11) return forms[0];
      if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return forms[1];
      return forms[2];
    }

    /* Все веса, которые реально собрать: ручка + любые комбинации блинов */
    function enumDumbbellOptions(handle, counts) {
      const opts = [];
      const ws = PLATE_TYPES.filter((p) => (counts[p] || 0) > 0);
      const cs = ws.map((p) => counts[p]);
      const cur = ws.map(() => 0);
      (function rec(i, sum) {
        if (i === ws.length) {
          const combo = {};
          ws.forEach((p, j) => { if (cur[j] > 0) combo[p] = cur[j]; });
          opts.push({ t: round1(handle + sum), combo });
          return;
        }
        for (let c = 0; c <= cs[i]; c++) { cur[i] = c; rec(i + 1, sum + c * ws[i]); }
      })(0, 0);
      opts.sort((a, b) => a.t - b.t);
      return opts;
    }

    function nearestOption(opts, target) {
      if (!opts || !opts.length) return null;
      let best = opts[0];
      opts.forEach((o) => {
        const d = Math.abs(o.t - target), bd = Math.abs(best.t - target);
        if (d < bd || (d === bd && o.t < best.t)) best = o;
      });
      return best;
    }

    /* Насколько фаза поднимает вес относительно недели 1 (для стандартной программы) */
    function phaseDelta(key, week) {
      return round1(getPhaseForWeek(week).weights[key] - BASE_PHASES[0].weights[key]);
    }

    /* Вес упражнения с учётом инвентаря юзера (или классический, если план без движка) */
    function exWeight(key, week, overrides, plan) {
      if (plan && plan.db && plan.db.opts && plan.db.opts.length) {
        const starter = plan.db.starters[key] != null ? plan.db.starters[key] : BASE_PHASES[0].weights[key];
        const target = round1(starter + phaseDelta(key, week));
        const opt = nearestOption(plan.db.opts, target);
        if (opt) return opt.t;
      }
      return effectiveWeight(key, week, overrides);
    }

    /* Текст сборки гантели под конкретный вес из инвентаря юзера */
    function discTextFor(weight, plan) {
      if (!(plan && plan.db && plan.db.opts && plan.db.opts.length)) return null;
      const opt = nearestOption(plan.db.opts, weight);
      if (!opt || Math.abs(opt.t - weight) > 0.05) return null;
      const parts = [];
      Object.keys(opt.combo).map(Number).sort((a, b) => b - a).forEach((p) => {
        const n = opt.combo[p];
        parts.push(`${n} ${pluralRu(n, ["диск", "диска", "дисков"])} по ${p} кг`);
      });
      const side = parts.length ? parts.join(", ") : "без блинов";
      return `ручка ${plan.db.handle} кг + с каждой стороны: ${side}`;
    }

    /* ================= Двойная прогрессия =================
       Если инвентарь на максимуме и фаза хочет поднять вес выше потолка —
       вместо веса растут повторы (+2 к диапазону за каждую «упёртую» фазу). */
    function cappedSteps(key, week, plan) {
      if (!(plan && plan.db && plan.db.opts && plan.db.opts.length)) return 0;
      const opts = plan.db.opts;
      const maxT = opts[opts.length - 1].t;
      const starter = plan.db.starters[key] != null ? plan.db.starters[key] : BASE_PHASES[0].weights[key];
      let steps = 0;
      BASE_PHASES.forEach((ph) => {
        const phEnd = ph.weeks[ph.weeks.length - 1];
        if (phEnd <= week) {
          const target = round1(starter + phaseDelta(key, ph.weeks[0]));
          if (target > maxT + 0.01) steps++;
        }
      });
      return Math.min(steps, 2);
    }
    function repsWithProgression(baseReps, steps) {
      if (!steps) return baseReps;
      const m = baseReps.match(/(\d+)–(\d+)/);
      if (!m) return baseReps;
      const a = Math.min(20, parseInt(m[1]) + 2 * steps);
      const b = Math.min(22, parseInt(m[2]) + 2 * steps);
      return `${a}–${b}`;
    }

    /* План = набор упражнений + (опц.) движок гантелей + длительность */
    function buildPlan(selectedMuscles, dbEngine) {
      const sel = new Set(selectedMuscles || []);
      let keys;
      if (sel.size === 0) keys = EXERCISES.map((e) => e.key);
      else {
        keys = EXERCISES.filter((e) => MUSCLE_OF_EX[e.key].some((m) => sel.has(m))).map((e) => e.key);
        if (keys.length < 4) keys = EXERCISES.map((e) => e.key);
      }
      const plan = { keys, weeks: 21 };
      if (dbEngine) plan.db = dbEngine;
      return plan;
    }
    /* Длина программы — параметр плана (для будущих программ другой длины) */
    function progLen(plan) { return (plan && plan.weeks) || 21; }

    function planExercises(plan) {
      if (!plan || !plan.keys || !plan.keys.length) return EXERCISES;
      const list = plan.keys.map((k) => EX_BY_KEY[k]).filter(Boolean);
      return list.length ? list : EXERCISES;
    }

    const DAYS = [
      { key: "mon", label: "День 1", color: "#C0392B", bgGrad: "linear-gradient(135deg, rgba(192,57,43,0.15) 0%, rgba(29,24,21,1) 100%)" },
      { key: "wed", label: "День 2", color: "#8E44AD", bgGrad: "linear-gradient(135deg, rgba(142,68,173,0.15) 0%, rgba(29,24,21,1) 100%)" },
      { key: "fri", label: "День 3", color: "#2980B9", bgGrad: "linear-gradient(135deg, rgba(41,128,185,0.15) 0%, rgba(29,24,21,1) 100%)" },
    ];

    function workoutFor(phase, week, overrides, plan) {
      const list = [];
      list.push({
        key: "warmup", name: "Суставная разминка", reps: "3–5 мин", restSec: 0,
        tip: "Плавные круговые вращения шеей, плечами, локтями, тазом и коленями (по 10 раз в каждую сторону) + 10 легких приседаний без веса для разогрева суставов.",
        gif: null, weight: null, sets: 1, isTime: true
      });
      let exs = planExercises(plan);
      if (week === 1) exs = exs.filter((ex) => ex.key !== "rdl");
      exs.forEach((ex) => {
        const steps = cappedSteps(ex.key, week, plan);
        list.push({
          key: ex.key, name: ex.name,
          reps: steps ? `${repsWithProgression(ex.reps, steps)} повторов` : ex.reps,
          capped: steps > 0,
          restSec: ex.restSec, tip: ex.tip, gif: ex.gif,
          weight: exWeight(ex.key, week, overrides, plan),
          sets: ex.type === "big" ? phase.sets.big : phase.sets.iso,
          discSetup: (w) => discTextFor(w, plan) || ex.discSetup(w),
        });
      });
      list.push({ key: "plank", name: "Планка", reps: `${phase.plankSec} сек`, restSec: 60, tip: "Планка на предплечьях. Корпус прямой как натянутая струна, пресс сжат.", gif: "./gifs/plank.gif", weight: null, sets: 3, isTime: true });
      return list;
    }

    function isPhotoWeek(week) { return week % 2 === 1; }

    function emptyChecksForWeek(phase, week, overrides, plan) {
      const wk = workoutFor(phase, week, overrides, plan);
      const perDay = {};

    function legacyCompress(file, maxDim = 800, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
            else if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
            const canvas = document.createElement("canvas");
            canvas.width = width; canvas.height = height;
            canvas.getContext("2d").drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
    async function compressImage(file, maxDim = 800, quality = 0.72) {
      try {
        if (window.createImageBitmap) {
          // imageOrientation:'from-image' — фото с iPhone больше не ложатся набок
          const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
          let w = bmp.width, h = bmp.height;
          if (w > h && w > maxDim) { h = Math.round(h * (maxDim / w)); w = maxDim; }
          else if (h > maxDim) { w = Math.round(w * (maxDim / h)); h = maxDim; }
          const cv = document.createElement("canvas");
          cv.width = w; cv.height = h;
          cv.getContext("2d").drawImage(bmp, 0, 0, w, h);
          const url = cv.toDataURL("image/jpeg", quality);
          if (bmp.close) bmp.close();
          return url;
        }
      } catch (e) {}
      return legacyCompress(file, maxDim, quality);

            style={{
              background: week >= maxWeeks ? "transparent" : C.surfaceRaised,
              border: `1px solid ${week >= maxWeeks ? "transparent" : C.border}`,
              borderRadius: 8, padding: "8px 14px", color: week >= maxWeeks ? C.textFaint : C.text,
              fontSize: 13, fontWeight: 700, cursor: week >= maxWeeks ? "not-allowed" : "pointer",
              display: "flex", alignItems: "center", gap: 4, transition: "background 150ms"
            }}>
            След. ›
          </button>
        </div>
      );
    }

    /* ================= Блин + дуга прогресса + легенда дней ================= */
    function PlateBadge({ week, phase, currentChecks, overrides, plan, completedCount, len = 21 }) {
      const list = workoutFor(phase, week, overrides, plan);

      const dayStatuses = DAYS.map((d) => {
        const checksForDay = currentChecks[d.key];
        const isDone = checksForDay && list.every((ex) => {
          const arr = Array.isArray(checksForDay[ex.key]) ? checksForDay[ex.key] : [Boolean(checksForDay[ex.key])];
          return arr.every(Boolean);
        });
        return { label: d.label, color: d.color, isDone };
      });

      const R = 99;
      const ARC_LEN = 2 * Math.PI * R;
      const done = Math.min(completedCount, len);
      const arcLen = ARC_LEN * (done / 21);

      return (
        <div style={{ textAlign: "center", margin: "4px auto 14px" }}>
          <div style={{ position: "relative", width: 118, height: 118, margin: "0 auto" }}>
            <svg viewBox="-9 -9 218 218" width="118" height="118" style={{ transform: "rotate(-90deg)" }}>
              <circle cx="100" cy="100" r={R} fill="none" stroke={C.border} strokeWidth="3" />
              <circle cx="100" cy="100" r={R} fill="none" stroke={C.done} strokeWidth="3" strokeLinecap="round"
                      strokeDasharray={`${arcLen} ${ARC_LEN}`} style={{ transition: "stroke-dasharray 600ms cubic-bezier(.4,0,.2,1)" }} />
            </svg>
            <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
              <svg viewBox="0 0 200 200" width="104" height="104">
                <defs>
                  <radialGradient id="plateGrad" cx="45%" cy="40%" r="60%">
                    <stop offset="0%" stopColor="#2D231E" /><stop offset="70%" stopColor="#1B1512" /><stop offset="100%" stopColor="#110E0C" />
                  </radialGradient>
                </defs>
                <circle cx="100" cy="100" r="94" fill="url(#plateGrad)" stroke={C.accent} strokeWidth="3.5" />
                <circle cx="100" cy="100" r="80" fill="none" stroke={C.accent} strokeWidth="1.5" opacity="0.4" />
                <circle cx="100" cy="100" r="66" fill="none" stroke={C.accent} strokeWidth="1.2" opacity="0.25" />
                <circle cx="100" cy="100" r="32" fill="#14110E" stroke={C.accent} strokeWidth="2.5" />
                <text x="100" y="81" textAnchor="middle" fill="#A79D92" fontSize="9.5" fontWeight="800" letterSpacing="3">НЕДЕЛЯ</text>
                <text x="100" y="125" textAnchor="middle" fill="#F2EDE7" fontSize="33" fontWeight="900">{week}</text>
              </svg>
            </div>
          </div>
          <div style={{ fontSize: 10.5, color: C.textFaint, fontWeight: 700, marginTop: 2, fontFamily: "ui-monospace, monospace" }}>
            прогресс: {done}/{len} недель
          </div>
          <div style={{ fontSize: 11.5, letterSpacing: "0.14em", color: C.accent, fontWeight: 800, textTransform: "uppercase", marginTop: 6, marginBottom: 6 }}>
            ЭТАП {phase.id}: {phase.label}
          </div>
          <div style={{ display: "flex", justifyContent: "center", gap: 10, alignItems: "center" }}>
            {dayStatuses.map((ds, i) => (
              <span key={i} title={ds.label} style={{ display: "inline-flex", alignItems: "center", gap: 4 }}>
                <span style={{
                  width: 8, height: 8, borderRadius: 9999,
                  background: ds.isDone ? C.done : "transparent",
                  border: `1.5px solid ${ds.isDone ? C.done : ds.color}`,
                  boxShadow: ds.isDone ? "0 0 8px rgba(76,154,107,0.7)" : "none",
                  transition: "all 200ms"
                }} />
                <span style={{ fontSize: 10, color: C.textFaint, fontWeight: 700 }}>{ds.label.replace("День ", "Д")}</span>
              </span>
            ))}
          </div>
        </div>
      );
    }

    /* ================= Таймер отдыха (фикс зависимостей) ================= */
    function RestTimer({ durationSec, onFinish, isLast }) {
      const [secondsLeft, setSecondsLeft] = useState(durationSec);
      const finishedRef = useRef(false);

      useEffect(() => {
        if (secondsLeft <= 0) {
          if (!finishedRef.current) {
            finishedRef.current = true;
            if (onFinish) onFinish();
          }
          return;
        }
        const t = setTimeout(() => setSecondsLeft((s) => s - 1), 1000);
        return () => clearTimeout(t);
      }, [secondsLeft]);

      if (secondsLeft <= 0) {
        return (
          <span style={{ fontSize: 11, color: C.done, fontWeight: 700, padding: "2px 6px", borderRadius: 4, background: "rgba(76,154,107,0.15)" }}>
            ✓ {isLast ? "Пора к следующему упражнению!" : "Пора к подходу!"}
          </span>
        );
      }
      return (
        <span style={{ fontSize: 11, color: "#E67E22", fontWeight: 700, padding: "2px 6px", borderRadius: 4, background: "rgba(230,126,34,0.15)", fontFamily: "ui-monospace, monospace" }}>
          ⏱ Отдых: {secondsLeft}с
        </span>
      );
    }

    function announceRestEnd(soundOn) {
      triggerHaptic("success");
      if (soundOn !== false) playChime();
    }

    /* Чекбокс подхода: визуал 22px, тап-зона ~44px на всю обёртку */
    function SetCheck({ checked, label, onToggle }) {
      return (
        <div onClick={onToggle} role="checkbox" aria-checked={checked}
             style={{ display: "flex", alignItems: "center", gap: 6, padding: "10px 8px", margin: "-10px -8px", cursor: "pointer", minHeight: 44 }}>
          <span style={{
            width: 22, height: 22, borderRadius: 6, flexShrink: 0, pointerEvents: "none",
            border: `2px solid ${checked ? C.done : C.textMuted}`, background: checked ? C.done : "transparent",
            display: "inline-flex", alignItems: "center", justifyContent: "center",
            transition: "background 150ms, border-color 150ms"
          }}>
            {checked && (
              <svg width="13" height="13" viewBox="0 0 20 20" fill="none">
                <path d="M4 10.5L8 14.5L16 5.5" stroke={C.bg} strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round" />
              </svg>
            )}
          </span>
          <span style={{ fontSize: 11.5, color: C.textFaint, pointerEvents: "none" }}>{label}</span>
        </div>
      );
    }

    function ExerciseRow({ ex, checks, onToggleSet, onOpenInfo, activeTimerIndex, setActiveTimerIndex, soundOn }) {
      const setList = Array.isArray(checks) ? checks : [Boolean(checks)];
      const words = ex.name.split(" ");
      const lastWord = words.pop();
      const mainText = words.join(" ");
      const isFocused = setList.some(Boolean) && !setList.every(Boolean);
      const allDone = setList.every(Boolean);

      return (
        <div style={{
          padding: "10px 8px", marginBottom: 6, borderRadius: 10,
          background: allDone ? "rgba(76,154,107,0.07)" : "transparent",
          borderBottom: isFocused ? `2px solid ${C.blueFocus}` : `1px solid ${allDone ? "rgba(76,154,107,0.25)" : C.border}`,
          transition: "border-color 250ms, background 250ms"
        }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 4, gap: 8 }}>
            <div style={{ flex: "1 1 auto", minWidth: 0, fontSize: 14.5, color: allDone ? C.textMuted : C.text, fontWeight: 600, lineHeight: 1.3 }}>
              {mainText}{mainText ? " " : ""}
              <span style={{ whiteSpace: "nowrap" }}>
                {lastWord}
                <button onClick={() => onOpenInfo(ex)}
                        style={{ marginLeft: 6, verticalAlign: "middle", background: "rgba(255,255,255,0.08)", border: `1px solid ${C.border}`, borderRadius: 12, width: 22, height: 22, color: C.textMuted, fontSize: 12, cursor: "pointer", display: "inline-flex", alignItems: "center", justifyContent: "center" }}>
                  ⓘ
                </button>
              </span>
            </div>
            <div style={{ flexShrink: 0, marginTop: 2, fontSize: 13, color: isFocused ? C.blueFocus : C.textMuted, fontWeight: 700, fontFamily: "ui-monospace, monospace", whiteSpace: "nowrap" }}>
              {ex.isTime || ex.weight == null ? (ex.key === "warmup" ? "3–5 мин" : "без веса") : `${ex.weight} кг`}
              {ex.capped && <span title="Инвентарь на максимуме — прогрессируем повторами" style={{ color: "#E67E22", fontSize: 10.5, fontWeight: 800 }}> · ↑повт</span>}
            </div>
          </div>

          <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", paddingLeft: 8 }}>
            <span style={{ fontSize: 12, color: C.textMuted, fontWeight: 600 }}>
              {ex.key === "warmup" ? "Разминка:" : "Подходы:"}
            </span>
            {setList.map((c, i) => (
              <React.Fragment key={i}>
                <SetCheck
                  checked={c}
                  label={ex.key === "warmup" ? "Выполнено" : `${i + 1} (${ex.reps.split(" ")[0]})`}
                  onToggle={() => {
                    triggerHaptic("selection");
                    onToggleSet(ex.key, i);
                    if (!c && ex.restSec > 0) setActiveTimerIndex(i);
                    else if (activeTimerIndex === i) setActiveTimerIndex(null);
                  }}
                />
                {c && activeTimerIndex === i && ex.restSec > 0 && (
                  <RestTimer durationSec={ex.restSec || 60} isLast={i === setList.length - 1}
                             onFinish={() => { setActiveTimerIndex(null); announceRestEnd(soundOn); }} />
                )}
              </React.Fragment>
            ))}
          </div>

          {isFocused && (
            <div style={{ display: "flex", justifyContent: "center", marginTop: 6, marginBottom: 2 }}>
              <span style={{
                background: "#0D0B0A", color: "#F2EDE7", border: `1px solid ${C.blueFocus}`, borderRadius: 6,
                padding: "2px 8px", fontSize: 10, fontWeight: 800, textTransform: "uppercase", letterSpacing: "0.08em"
              }}>
                ● Текущее
              </span>
            </div>
          )}
        </div>
      );
    }

    /* ================= Фото прогресса ================= */
    function PhotoSlot({ week, photoDataUrl, onPick, busy, onPreviewImage }) {
      const inputRef = useRef(null);
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          {photoDataUrl ? (
            <img src={photoDataUrl} alt={`Неделя ${week}`} onClick={() => onPreviewImage(photoDataUrl)}
                 style={{ width: 44, height: 44, objectFit: "cover", borderRadius: 8, border: `1.5px solid ${C.accent}`, cursor: "pointer" }} />
          ) : (
            <div style={{ width: 44, height: 44, borderRadius: 8, border: `1px dashed ${C.textFaint}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}>📷</div>
          )}
          <button onClick={() => inputRef.current && inputRef.current.click()} disabled={busy}
            style={{ background: "none", border: "none", color: C.accent, fontSize: 13, fontWeight: 700, cursor: "pointer", padding: 0 }}>
            {busy ? "Сохраняю..." : photoDataUrl ? "Заменить фото" : "📸 Добавить фото прогресса"}
          </button>
          <input ref={inputRef} type="file" accept="image/*" capture="environment" style={{ display: "none" }}
            onChange={(e) => { const f = e.target.files && e.target.files[0]; if (f) onPick(f); e.target.value = ""; }} />
        </div>
      );
    }

    /* ================= Карточка дня (+анимации перехода) ================= */
    function DayCard({ day, index, phase, week, overrides, plan, checksForDay, onToggleSet, onToggleAll,
                       bodyWeight, onBodyWeightChange, currentPhotoUrl, onPhotoPick, photoBusy, onOpenInfo,
                       defaultOpen, onPreviewImage, isLocked, readOnly, animStage, soundOn }) {
      const list = workoutFor(phase, week, overrides, plan);
      const allDone = list.every((ex) => {
        const arr = checksForDay && checksForDay[ex.key];
        return Array.isArray(arr) ? arr.every(Boolean) : Boolean(arr);
      });
      const showPhoto = day.key === "mon" && isPhotoWeek(week);

      const [activeTimers, setActiveTimers] = useState({});
      const [open, setOpen] = useState(defaultOpen);
      const bodyRef = useRef(null);

      useEffect(() => { setOpen(defaultOpen); }, [defaultOpen]);

      // Сворачивание карточки после завершения дня
      useEffect(() => {
        if (animStage === "collapse" && bodyRef.current) {
          const el = bodyRef.current;
          el.style.overflow = "hidden";
          el.style.maxHeight = el.scrollHeight + "px";
          requestAnimationFrame(() => { el.style.maxHeight = "52px"; });
        }
      }, [animStage]);

      const lockedStyle = (isLocked || readOnly)
        ? { opacity: 0.55, pointerEvents: "none" } : {};

      return (
        <div style={{
          background: day.bgGrad || C.surface,
          border: `1.5px solid ${allDone ? C.done : day.color}`,
          borderRadius: 14, padding: "16px 16px", marginBottom: 16,
          boxShadow: animStage === "flash" ? undefined : (allDone ? "0 4px 14px rgba(76,154,107,0.15)" : "none"),
          transition: "border-color 200ms, box-shadow 300ms, opacity 200ms",
          ...(animStage === "flash" ? { animation: "nfFlash .6s ease both" } : {}),
          ...(animStage === "opening" ? { animation: "nfPulse 1.4s ease" } : {}),
          ...lockedStyle
        }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: open ? 10 : 0, gap: 10 }}>
            <button onClick={() => { triggerHaptic("selection"); setOpen((v) => !v); }} aria-expanded={open}
              style={{ flex: "1 1 auto", minWidth: 0, display: "flex", alignItems: "center", gap: 8, background: "none", border: "none", color: C.text, padding: 0, textAlign: "left", cursor: "pointer" }}>
              <span style={{ width: 10, height: 10, borderRadius: 999, background: allDone ? C.done : day.color }} />
              <span style={{ fontSize: 18, fontWeight: 800, color: C.text }}>{day.label}</span>
              {allDone && <span className={animStage === "flash" ? "nf-pop" : ""} style={{ fontSize: 11, color: C.done, fontWeight: 700, padding: "2px 6px", borderRadius: 4, background: "rgba(76,154,107,0.2)" }}>Готово ✓</span>}
              <span style={{ marginLeft: "auto", display: "inline-flex", alignItems: "center" }}>
                <ChevronIcon open={open} size={20} color={C.textMuted} />
              </span>
            </button>
            {!readOnly && (
              <button onClick={() => { triggerHaptic("medium"); onToggleAll(day.key, !allDone); }} aria-label="Отметить весь день"
                style={{
                  width: 30, height: 30, borderRadius: 8, flexShrink: 0, cursor: "pointer",
                  border: `2px solid ${allDone ? C.done : C.textMuted}`, background: allDone ? C.done : "transparent",
                  display: "flex", alignItems: "center", justifyContent: "center", padding: 0,
                  transition: "background 150ms, border-color 150ms"
                }}>
                {allDone && (
                  <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
                    <path d="M4 10.5L8 14.5L16 5.5" stroke={C.bg} strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round" />
                  </svg>
                )}
              </button>
            )}
          </div>

          <div ref={bodyRef} style={{ overflow: animStage === "collapse" ? "hidden" : undefined, transition: animStage === "collapse" ? "max-height .55s cubic-bezier(.4,0,.2,1)" : undefined }}>
            {open && day.key === "mon" && (
              <div style={{ background: C.surfaceRaised, borderRadius: 10, padding: "10px 12px", marginBottom: 12, display: "flex", flexDirection: "column", gap: 10 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontSize: 14 }}>⚖</span>
                  <span style={{ fontSize: 13, color: C.textMuted }}>Вес тела:</span>
                  <button onClick={() => onBodyWeightChange(round1(Math.max(30, (parseFloat(bodyWeight) || 0) - 0.1)) )}
                          style={{ width: 30, height: 30, borderRadius: 6, border: `1px solid ${C.border}`, background: C.bg, color: C.text, cursor: "pointer", fontWeight: 800 }}>−</button>
                  <input type="number" step="0.1" inputMode="decimal" placeholder="—"
                    value={bodyWeight ?? ""} onChange={(e) => onBodyWeightChange(e.target.value === "" ? null : parseFloat(e.target.value))}
                    style={{ width: 64, fontSize: 13, padding: "5px 6px", borderRadius: 6, border: `1px solid ${C.border}`, background: C.bg, color: C.text, textAlign: "center" }} />
                  <button onClick={() => onBodyWeightChange(round1(Math.min(250, (parseFloat(bodyWeight) || 0) + 0.1)))}
                          style={{ width: 30, height: 30, borderRadius: 6, border: `1px solid ${C.border}`, background: C.bg, color: C.text, cursor: "pointer", fontWeight: 800 }}>+</button>
                  <span style={{ fontSize: 12, color: C.textFaint }}>кг</span>
                </div>
                {showPhoto && <PhotoSlot week={week} photoDataUrl={currentPhotoUrl} onPick={onPhotoPick} busy={photoBusy} onPreviewImage={onPreviewImage} />}
              </div>
            )}

            {open && (
              <div>
                {list.map((ex) => (
                  <ExerciseRow
                    key={ex.key} ex={ex} soundOn={soundOn}
                    checks={checksForDay ? checksForDay[ex.key] || [] : []}
                    onToggleSet={(k, i) => onToggleSet(day.key, k, i)}
                    onOpenInfo={onOpenInfo}
                    activeTimerIndex={activeTimers[ex.key]}
                    setActiveTimerIndex={(idx) => setActiveTimers((prev) => ({ ...prev, [ex.key]: idx }))}
                  />
                ))}
              </div>
            )}

            {open && (
              <div style={{ marginTop: 12, fontSize: 12, color: C.textMuted, lineHeight: 1.4 }}>
                🥤 После тренировки: <span style={{ color: C.accent, fontWeight: 700 }}>протеин + креатин (3–5 г)</span>
              </div>
            )}
          </div>
        </div>
      );
    }

    /* ================= Прогресс «Было → Стало» ================= */
    function ProgressPanel({ week, overrides, plan, bodyWeightLog, photoWeeks, completedWeeks, onPreviewImage }) {
      const [open, setOpen] = useState(false);
      const [p1, setP1] = useState(null);
      const [p2, setP2] = useState(null);
      const len = progLen(plan);

      const completedCount = Object.keys(completedWeeks).length;
      const hasComparison = completedCount >= 2 || photoWeeks.length >= 2;

      const bwWeeks = Object.keys(bodyWeightLog).map(Number).sort((a, b) => a - b);
      const bwFirst = bwWeeks.length ? bodyWeightLog[bwWeeks[0]] : null;
      const bwLast = bwWeeks.length ? bodyWeightLog[bwWeeks[bwWeeks.length - 1]] : null;

      const firstPhotoWeek = photoWeeks.length ? photoWeeks[0] : null;
      const lastPhotoWeek = photoWeeks.length ? photoWeeks[photoWeeks.length - 1] : null;

      useEffect(() => {
        if (open) {
          if (firstPhotoWeek) getPhotoLocal(firstPhotoWeek).then(setP1);
          if (lastPhotoWeek && lastPhotoWeek !== firstPhotoWeek) getPhotoLocal(lastPhotoWeek).then(setP2);
        }
      }, [open, firstPhotoWeek, lastPhotoWeek]);

      return (
        <div style={{ marginTop: 18, marginBottom: 18, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: "14px 16px" }}>
          <button onClick={() => { triggerHaptic("selection"); setOpen((v) => !v); }} style={{ background: "none", border: "none", color: C.text, fontSize: 14.5, fontWeight: 800, cursor: "pointer", display: "flex", alignItems: "center", gap: 8, padding: 0, width: "100%", justifyContent: "space-between" }}>
            <span>{hasComparison ? "📊 Прогресс: Было → Стало" : "🏁 Ваша начальная точка (Старт)"}</span>
            <ChevronIcon open={open} size={18} color={C.textMuted} />
          </button>

          {open && (
            <div style={{ marginTop: 14 }}>
              {!hasComparison ? (
                <div>
                  <div style={{ background: C.surfaceRaised, borderRadius: 10, padding: "12px", marginBottom: 14, fontSize: 13, color: C.textMuted, lineHeight: 1.5 }}>
                    💡 <b>Вы на старте!</b> Записывайте вес тела и прикрепляйте фото. Сравнение <b>«Было → Стало»</b> включится после первых двух закрытых недель.
                  </div>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12, fontSize: 13.5 }}>
                    <span style={{ color: C.textMuted }}>Текущий вес тела:</span>
                    <span style={{ color: C.text, fontWeight: 700 }}>{bwFirst != null ? `${bwFirst} кг` : "не указан"}</span>
                  </div>
                  {p1 && (
                    <div>
                      <div style={{ fontSize: 12, color: C.textMuted, marginBottom: 6 }}>Стартовое фото (Неделя {firstPhotoWeek}):</div>
                      <div style={{ width: 110, height: 140, borderRadius: 10, overflow: "hidden", border: `1.5px solid ${C.accent}`, background: C.bg, cursor: "pointer" }} onClick={() => onPreviewImage(p1)}>
                        <img src={p1} alt="Старт" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                      </div>
                    </div>
                  )}
                </div>
              ) : (
                <div>
                  <div style={{ fontSize: 12.5, color: C.textMuted, marginBottom: 12 }}>
                    Закрыто недель: <b style={{ color: C.done }}>{completedCount}</b> из {len}
                  </div>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14, fontSize: 13.5, background: C.surfaceRaised, padding: "10px 12px", borderRadius: 8 }}>
                    <span style={{ color: C.textMuted }}>Вес тела:</span>
                    {bwFirst != null ? (
                      <span style={{ color: C.text, fontWeight: 700 }}>
                        {bwFirst} кг → {bwLast} кг
                        <span style={{ color: bwLast - bwFirst >= 0 ? C.done : C.accent, marginLeft: 6 }}>
                          ({bwLast - bwFirst >= 0 ? "+" : ""}{round1(bwLast - bwFirst)} кг)
                        </span>
                      </span>
                    ) : <span style={{ color: C.textFaint }}>не указан</span>}
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
                    {planExercises(plan).map((ex) => {
                      const w1 = exWeight(ex.key, 1, overrides, plan);
                      const wNow = exWeight(ex.key, week, overrides, plan);
                      const n1 = typeof w1 === "number" ? w1 : 0;
                      const nNow = typeof wNow === "number" ? wNow : 0;
                      const diff = nNow - n1;
                      return (
                        <div key={ex.key} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "4px 0", borderBottom: `1px solid ${C.border}` }}>
                          <span style={{ color: C.textMuted }}>{ex.name}</span>
                          <span style={{ color: C.text, fontFamily: "ui-monospace, monospace", whiteSpace: "nowrap" }}>
                            {w1} кг → {wNow} кг
                            {diff > 0 && <span style={{ color: C.done, marginLeft: 6 }}>(+{round1(diff)})</span>}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                  <div>
                    <div style={{ fontSize: 12.5, color: C.textMuted, marginBottom: 8 }}>
                      Фото: Неделя {firstPhotoWeek || 1} → Неделя {lastPhotoWeek || week}:
                    </div>
                    <div style={{ display: "flex", gap: 12 }}>
                      <div style={{ flex: 1, height: 160, borderRadius: 10, overflow: "hidden", border: `1px solid ${C.border}`, background: C.surfaceRaised, display: "flex", alignItems: "center", justifyContent: "center", cursor: p1 ? "pointer" : "default" }} onClick={() => p1 && onPreviewImage(p1)}>
                        {p1 ? <img src={p1} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <span style={{ fontSize: 11, color: C.textFaint }}>Старт</span>}
                      </div>
                      <div style={{ flex: 1, height: 160, borderRadius: 10, overflow: "hidden", border: `1px solid ${C.border}`, background: C.surfaceRaised, display: "flex", alignItems: "center", justifyContent: "center", cursor: p2 ? "pointer" : "default" }} onClick={() => p2 && onPreviewImage(p2)}>
                        {p2 ? <img src={p2} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <span style={{ fontSize: 11, color: C.textFaint }}>Сейчас</span>}
                      </div>

                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    /* ================= Роадмап на 21 неделю ================= */
    function Roadmap({ currentWeek, overrides, plan }) {
      const [open, setOpen] = useState(false);
      const rows = [];
      const len = progLen(plan);
      for (let w = 1; w <= len; w++) {
        const ph = getPhaseForWeek(w);
        if (rows.length === 0 || rows[rows.length - 1].id !== ph.id) {
          rows.push({ id: ph.id, label: ph.label, weeks: ph.weeks, phase: ph });
        }
      }
      const planned = planExercises(plan).filter((e) => ["squat", "floor", "ohp"].includes(e.key));
      return (
        <div style={{ marginTop: 18, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: "14px 16px" }}>
          <button onClick={() => { triggerHaptic("selection"); setOpen((v) => !v); }} style={{ background: "none", border: "none", color: C.text, fontSize: 14.5, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "space-between", width: "100%", padding: 0 }}>
            <span>🗺️ План тренировок · {len} недель</span>
            <ChevronIcon open={open} size={18} color={C.textMuted} />
          </button>
          {open && (
            <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 10 }}>
              {rows.map((r) => {
                const active = currentWeek >= r.weeks[0] && currentWeek <= r.weeks[r.weeks.length - 1];
                const midWeek = r.weeks[0];
                return (
                  <div key={r.id} style={{
                    background: active ? C.accentSoft : C.surfaceRaised,
                    border: `1px solid ${active ? C.accent : C.border}`,
                    borderRadius: 10, padding: "10px 12px", display: "flex", flexDirection: "column", gap: 6
                  }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <span style={{ fontSize: 13.5, fontWeight: 800, color: active ? C.text : C.textMuted }}>
                        Недели {r.weeks[0]}–{r.weeks[r.weeks.length - 1]}: <span style={{ color: active ? C.accent : C.text }}>{r.label}</span>
                      </span>
                      {active && <span style={{ fontSize: 10, fontWeight: 800, padding: "2px 6px", borderRadius: 4, background: C.accent, color: "#fff", textTransform: "uppercase" }}>Сейчас</span>}
                    </div>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: "6px 12px", fontSize: 12, color: C.textMuted, fontFamily: "ui-monospace, monospace" }}>
                      {planned.includes(EX_BY_KEY.squat) && <span>🏋️ Присед/Тяга: <b style={{ color: C.text }}>{exWeight("squat", midWeek, overrides, plan)} кг</b></span>}
                      {planned.includes(EX_BY_KEY.floor) && <span>💪 Жим лёжа: <b style={{ color: C.text }}>{exWeight("floor", midWeek, overrides, plan)} кг</b></span>}
                      {planned.includes(EX_BY_KEY.ohp) && <span>🙆 Жим плечи: <b style={{ color: C.text }}>{exWeight("ohp", midWeek, overrides, plan)} кг</b></span>}
                      <span>⏱ Планка: <b style={{ color: C.text }}>{r.phase.plankSec} сек</b></span>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    /* ================= Карта тела (для онбординга) ================= */
    function BodyMap({ sex, setSex, selected, setSelected }) {
      const frontRef = useRef(null);
      const backRef = useRef(null);
      const [useReal, setUseReal] = useState(hasReal(sex === "f" ? "fFront" : "mFront"));

      useEffect(() => { setUseReal(hasReal(sex === "f" ? "fFront" : "mFront")); }, [sex]);

      useEffect(() => {
        if (frontRef.current) frontRef.current.innerHTML = bodySvgFor(sex, "front");
        if (backRef.current) backRef.current.innerHTML = bodySvgFor(sex, "back");
        paintBodyMap(frontRef.current, selected);
        paintBodyMap(backRef.current, selected);
      }, [sex, useReal]);

      useEffect(() => {
        paintBodyMap(frontRef.current, selected);
        paintBodyMap(backRef.current, selected);
      }, [selected]);

      const toggle = (id) => {
        triggerHaptic("selection");
        setSelected((prev) => {
          const next = new Set(prev);
          next.has(id) ? next.delete(id) : next.add(id);
          return next;
        });
      };

      const handleSvgClick = (e) => {
        const g = e.target.closest("svg g[id]");
        if (g && MID_SET.has(g.id)) toggle(g.id);
      };

      return (
        <div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <div style={{ fontSize: 19, fontWeight: 900 }}>Что качаем?</div>
            <div style={{ display: "flex", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: 3, width: 110 }}>
              <button onClick={() => { setSex("m"); triggerHaptic("selection"); }}
                      style={{ flex: 1, border: "none", background: sex === "m" ? C.accent : "none", color: sex === "m" ? "#fff" : C.textMuted, fontWeight: 800, fontSize: 13, padding: "8px 0", borderRadius: 8, cursor: "pointer" }}>М</button>
              <button onClick={() => { setSex("f"); triggerHaptic("selection"); }}
                      style={{ flex: 1, border: "none", background: sex === "f" ? C.accent : "none", color: sex === "f" ? "#fff" : C.textMuted, fontWeight: 800, fontSize: 13, padding: "8px 0", borderRadius: 8, cursor: "pointer" }}>Ж</button>
            </div>
          </div>
          <div style={{ fontSize: 12, color: C.textMuted, margin: "6px 0 8px" }}>
            Тапни зону на теле или выбери плашку — она включает сразу пачку мышц.
          </div>

          <div id="bodymap-wrap" style={{ display: "flex", justifyContent: "center", gap: 8 }}>
            <div style={{ textAlign: "center" }}>
              <div ref={frontRef} className="bmcell" onClick={handleSvgClick} />
              <div style={{ fontSize: 9.5, color: C.textFaint, letterSpacing: ".1em", textTransform: "uppercase", fontWeight: 700, marginTop: 2 }}>Спереди</div>
            </div>
            <div style={{ textAlign: "center" }}>
              <div ref={backRef} className="bmcell" onClick={handleSvgClick} />
              <div style={{ fontSize: 9.5, color: C.textFaint, letterSpacing: ".1em", textTransform: "uppercase", fontWeight: 700, marginTop: 2 }}>Сзади</div>
            </div>
          </div>

          <div style={{ textAlign: "center", margin: "8px 0" }}>
            <span style={{ fontSize: 12, color: C.textMuted, background: C.surfaceRaised, border: `1px solid ${C.border}`, borderRadius: 999, padding: "6px 14px", fontWeight: 700 }}>
              {selected.size ? ("Мышц выбрано: " + selected.size) : "Можно ничего не выбирать — соберём всё тело"}
            </span>
          </div>

          <div style={{ fontSize: 10.5, color: C.textFaint, fontWeight: 800, textTransform: "uppercase", letterSpacing: ".1em", margin: "8px 0 6px" }}>Плашки</div>
          <div className="chipsbar">
            {PLATES_PRESETS.map((p) => {
              const on = p.m.every((m) => selected.has(m));
              return (
                <button key={p.id}
                  onClick={() => {
                    triggerHaptic("selection");
                    setSelected((prev) => {
                      const next = new Set(prev);
                      const all = p.m.every((m) => next.has(m));
                      p.m.forEach((m) => all ? next.delete(m) : next.add(m));
                      return next;
                    });
                  }}
                  style={{
                    borderRadius: 999, fontSize: 12.5, fontWeight: 800, padding: "9px 15px", cursor: "pointer",
                    border: `1.5px solid ${on ? C.accent : C.border}`, background: on ? C.accent : C.surface,
                    color: on ? "#fff" : C.textMuted, boxShadow: on ? "0 4px 14px rgba(192,57,43,.35)" : "none"
                  }}>
                  {p.n}
                </button>
              );
            })}
          </div>

          <div style={{ fontSize: 10.5, color: C.textFaint, fontWeight: 800, textTransform: "uppercase", letterSpacing: ".1em", margin: "10px 0 6px" }}>Мышцы</div>
          <div className="chipsbar">
            {MUSCLES.map((m) => {
              const on = selected.has(m.id);
              return (
                <button key={m.id} onClick={() => toggle(m.id)}
                  style={{
                    borderRadius: 999, fontSize: 11.5, fontWeight: 700, padding: "7px 11px", cursor: "pointer",
                    border: `1.5px ${on ? "solid" : "dashed"} ${on ? C.accent : "#3E352C"}`,
                    background: on ? "rgba(192,57,43,.22)" : "transparent", color: on ? C.text : C.textFaint
                  }}>
                  {m.n}{on ? " ✓" : ""}
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    /* ================= Онбординг ================= */
    function Onboarding({ onDone }) {
      const [step, setStep] = useState(0); // 0 анкета, 1 оборудование, 2 гантели, 3 карта тела, 4 генерация
      const [sex, setSex] = useState("m");
      const [height, setHeight] = useState("");
      const [weight, setWeight] = useState("");
      const [exp, setExp] = useState("new");
      const [equip, setEquip] = useState(new Set(["db"]));
      const [useCustomDb, setUseCustomDb] = useState(true);
      const [dbHandle, setDbHandle] = useState("2");
      const [dbPlates, setDbPlates] = useState({ "1.25": 4, "2.5": 4, "5": 0 });
      const [muscles, setMuscles] = useState(new Set());
      const [genStep, setGenStep] = useState(-1);

      const tgUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
      const hasDb = equip.has("db");
      const afterEquipStep = hasDb ? 2 : 3;

      const dbEngine = useMemo(() => {
        if (!hasDb || !useCustomDb) return null;
        const handle = Math.max(0, parseFloat(dbHandle) || 0);
        const counts = {};
        PLATE_TYPES.forEach((p) => { const n = Math.max(0, Math.min(10, parseInt(dbPlates[p]) || 0)); if (n > 0) counts[p] = n; });
        if (handle <= 0 && Object.keys(counts).length === 0) return null;
        const opts = enumDumbbellOptions(handle, counts);
        if (!opts.length) return null;
        const maxT = opts[opts.length - 1].t;
        const starters = {};
        EXERCISES.forEach((e) => {
          const def = DB_STARTERS[e.key];
          let target = exp === "some" ? def * 1.15 : def; // «занимался раньше» — старт чуть выше
          let opt = nearestOption(opts, target);
          if (opt.t > maxT) opt = opts[opts.length - 1];
          starters[e.key] = opt.t;
        });
        return { handle, counts, opts, starters };
      }, [hasDb, useCustomDb, dbHandle, dbPlates, exp]);

      const dbMax = dbEngine ? dbEngine.opts[dbEngine.opts.length - 1].t : null;

      const startGen = () => {
        setStep(4);
        [0, 1, 2, 3].forEach((i) => setTimeout(() => setGenStep(i), 400 + i * 700));
        setTimeout(() => setGenStep(4), 3150);
        setTimeout(() => {
          onDone({
            profile: {
              sex,
              height: parseFloat(height) || null,
              weight: parseFloat(weight) || null,
              exp,
              equip: [...equip],
              muscles: [...muscles],
              db: dbEngine ? { handle: dbEngine.handle, counts: dbEngine.counts } : null,
              name: tgUser ? (tgUser.first_name || "") : "",
            },
            plan: buildPlan([...muscles], dbEngine),
          });
        }, 3750);
      };

      const genStepsLabels = ["Анализирую параметры", "Подбираю упражнения", "Рассчитываю стартовые веса", "Строю прогрессию на 21 неделю"];
      const previewPlan = useMemo(() => buildPlan([...muscles], dbEngine), [muscles, dbEngine]);
      const plannedPreview = previewPlan.keys.slice(0, 4);

      return (
        <div style={{ minHeight: "100vh", padding: "20px 16px calc(24px + env(safe-area-inset-bottom))" }}>
          <div style={{ maxWidth: 480, margin: "0 auto" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, fontWeight: 900, letterSpacing: ".22em", color: C.textMuted }}>
              <span style={{ width: 22, height: 22, borderRadius: "50%", background: "radial-gradient(circle at 40% 35%,#3A2E26,#171310)", border: `2px solid ${C.accent}` }} />
              NEUROFIT
            </div>

            {step === 0 && (
              <div className="nf-rise">
                <div style={{ fontSize: 21, fontWeight: 900, marginTop: 18, lineHeight: 1.25 }}>Настроим программу<br />под тебя</div>
                <div style={{ color: C.textMuted, fontSize: 13, marginTop: 6 }}>Займёт 30 секунд. Всё остальное — по ходу дела.</div>

                <div style={{ marginTop: 16 }}>
                  <div style={{ fontSize: 11.5, color: C.textMuted, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".08em", marginBottom: 8 }}>Пол</div>
                  <div style={{ display: "flex", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: 3 }}>
                    <button onClick={() => setSex("m")} style={{ flex: 1, border: "none", background: sex === "m" ? C.accent : "none", color: sex === "m" ? "#fff" : C.textMuted, fontWeight: 700, fontSize: 13, padding: "9px 0", borderRadius: 8, cursor: "pointer" }}>Мужской</button>
                    <button onClick={() => setSex("f")} style={{ flex: 1, border: "none", background: sex === "f" ? C.accent : "none", color: sex === "f" ? "#fff" : C.textMuted, fontWeight: 700, fontSize: 13, padding: "9px 0", borderRadius: 8, cursor: "pointer" }}>Женский</button>
                  </div>
                </div>

                <div style={{ marginTop: 16 }}>
                  <div style={{ fontSize: 11.5, color: C.textMuted, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".08em", marginBottom: 8 }}>Рост и вес</div>
                  <div style={{ display: "flex", gap: 10 }}>
                    <div style={{ flex: 1, display: "flex", alignItems: "center", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: "11px 12px", gap: 6 }}>
                      <input type="number" inputMode="numeric" placeholder="178" value={height} onChange={(e) => setHeight(e.target.value)}
                             style={{ width: "100%", background: "none", border: "none", outline: "none", color: C.text, fontSize: 15, fontWeight: 700 }} />
                      <span style={{ color: C.textFaint, fontSize: 12 }}>см</span>
                    </div>
                    <div style={{ flex: 1, display: "flex", alignItems: "center", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: "11px 12px", gap: 6 }}>
                      <input type="number" inputMode="decimal" placeholder="76" value={weight} onChange={(e) => setWeight(e.target.value)}
                             style={{ width: "100%", background: "none", border: "none", outline: "none", color: C.text, fontSize: 15, fontWeight: 700 }} />
                      <span style={{ color: C.textFaint, fontSize: 12 }}>кг</span>
                    </div>
                  </div>
                </div>

                <div style={{ marginTop: 16 }}>
                  <div style={{ fontSize: 11.5, color: C.textMuted, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".08em", marginBottom: 8 }}>Опыт</div>
                  <div className="chipsbar">
                    {[["new", "Новичок"], ["some", "Занимался раньше"]].map(([id, n]) => (
                      <button key={id} onClick={() => { setExp(id); triggerHaptic("selection"); }}
                              style={{ border: `1px solid ${exp === id ? C.accent : C.border}`, background: exp === id ? C.accentSoft : C.surface, color: exp === id ? C.text : C.textMuted, borderRadius: 999, fontSize: 12.5, fontWeight: 700, padding: "8px 14px", cursor: "pointer" }}>
                        {n}
                      </button>
                    ))}
                  </div>
                </div>

                <button onClick={() => { triggerHaptic("light"); setStep(1); }}
                        style={{ marginTop: 22, width: "100%", padding: 14, border: "none", borderRadius: 12, background: C.accent, color: "#fff", fontSize: 14.5, fontWeight: 800, cursor: "pointer", boxShadow: "0 6px 20px rgba(192,57,43,.35)" }}>
                  Продолжить →
                </button>
                <div style={{ textAlign: "center", marginTop: 12, fontSize: 11.5, color: C.textMuted }}>
                  {tgUser ? `Привет, ${tgUser.first_name}! Имя и фото подтянулись из Telegram` : "Имя подтянется из Telegram автоматически"}
                </div>
              </div>
            )}

            {step === 1 && (
              <div className="nf-rise">
                <div style={{ fontSize: 21, fontWeight: 900, marginTop: 18 }}>Какое оборудование есть?</div>
                <div style={{ color: C.textMuted, fontSize: 13, marginTop: 6 }}>
                  Можно выбрать несколько. Пока программа собирается для гантелей — остальное подключим следом.
                </div>
                <div className="chipsbar" style={{ marginTop: 16 }}>
                  {EQUIPMENT.map(([id, n]) => {
                    const on = equip.has(id);
                    return (
                      <button key={id}
                        onClick={() => {
                          triggerHaptic("selection");
                          setEquip((prev) => { const nx = new Set(prev); nx.has(id) ? nx.delete(id) : nx.add(id); return nx; });
                        }}
                        style={{ border: `1px solid ${on ? C.accent : C.border}`, background: on ? C.accentSoft : C.surface, color: on ? C.text : C.textMuted, borderRadius: 999, fontSize: 13, fontWeight: 700, padding: "9px 16px", cursor: "pointer" }}>
                        {n}
                      </button>
                    );
                  })}
                </div>
                <div style={{ marginTop: 12 }}>
                  <button
                    onClick={() => setEquip((prev) => prev.size === EQUIPMENT.length ? new Set() : new Set(EQUIPMENT.map((e) => e[0])))}
                    style={{ border: `1px dashed ${C.border}`, background: "none", color: C.textFaint, borderRadius: 999, fontSize: 12, fontWeight: 700, padding: "8px 14px", cursor: "pointer" }}>
                    {equip.size === EQUIPMENT.length ? "Снять всё" : "Выбрать всё"}
                  </button>
                </div>
                <button onClick={() => { triggerHaptic("light"); setStep(afterEquipStep); }}
                        style={{ marginTop: 22, width: "100%", padding: 14, border: "none", borderRadius: 12, background: C.accent, color: "#fff", fontSize: 14.5, fontWeight: 800, cursor: "pointer" }}>
                  Далее →
                </button>
                <button onClick={() => setStep(0)} style={{ marginTop: 10, width: "100%", padding: 12, background: "none", border: `1px solid ${C.border}`, borderRadius: 12, color: C.text, fontSize: 13.5, fontWeight: 600, cursor: "pointer" }}>
                  ← Назад
                </button>
              </div>
            )}

            {step === 2 && (
              <div className="nf-rise">
                <div style={{ fontSize: 21, fontWeight: 900, marginTop: 18 }}>Твои гантели</div>
                <div style={{ color: C.textMuted, fontSize: 13, marginTop: 6, lineHeight: 1.5 }}>
                  Укажи вес ручки и сколько дисков надевается на <b>одну</b> гантель — программа подберёт веса, которые ты реально можешь собрать.
                </div>

                <div style={{ marginTop: 16, display: "flex", alignItems: "center", gap: 8, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: "11px 12px" }}>
                  <span style={{ fontSize: 13, color: C.textMuted }}>Вес разборной ручки:</span>
                  <input type="number" inputMode="decimal" value={dbHandle} onChange={(e) => setDbHandle(e.target.value)}
                         style={{ width: 64, textAlign: "center", background: C.bg, border: `1px solid ${C.border}`, borderRadius: 6, color: C.text, padding: "5px 6px", fontSize: 14, fontWeight: 700 }} />
                  <span style={{ fontSize: 12, color: C.textFaint }}>кг</span>
                </div>

                <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 8 }}>
                  {PLATE_TYPES.map((p) => (
                    <div key={p} style={{ display: "flex", alignItems: "center", gap: 10, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: "9px 12px" }}>
                      <span style={{ flex: 1, fontSize: 13.5, fontWeight: 700 }}>Диски по {p} кг</span>
                      <button onClick={() => setDbPlates((s) => ({ ...s, [p]: Math.max(0, (parseInt(s[p]) || 0) - 1) }))}
                              style={{ width: 32, height: 32, borderRadius: 8, border: `1px solid ${C.border}`, background: C.bg, color: C.text, cursor: "pointer", fontWeight: 800 }}>−</button>
                      <span style={{ width: 28, textAlign: "center", fontSize: 15, fontWeight: 900, fontFamily: "ui-monospace, monospace" }}>{dbPlates[p] || 0}</span>

                              style={{ width: 32, height: 32, borderRadius: 8, border: `1px solid ${C.border}`, background: C.bg, color: C.text, cursor: "pointer", fontWeight: 800 }}>+</button>
                      <span style={{ width: 26, fontSize: 11.5, color: C.textFaint }}>шт</span>
                    </div>
                  ))}
                </div>

                {dbEngine && dbMax != null && (
                  <div style={{ marginTop: 12, background: C.accentSoft, border: `1px solid ${C.accentDim}`, borderRadius: 10, padding: "10px 12px", fontSize: 13 }}>
                    🏋️ Максимум на одну гантель: <b>{dbMax} кг</b> · старт программы:{" "}
                    <b>{dbEngine.starters.squat} кг</b> (присед)
                  </div>

                <label style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 12, fontSize: 12.5, color: C.textMuted, cursor: "pointer" }}>

                </label>

                        style={{ marginTop: 18, width: "100%", padding: 14, border: "none", borderRadius: 12, background: C.accent, color: "#fff", fontSize: 14.5, fontWeight: 800, cursor: "pointer" }}>
                  Далее →
