    <!--
      Отладочная ловушка ошибок.
      Показывается ТОЛЬКО если открыть с ?debug=1 или через deep-link ?startapp=debug.
      Обычные пользователи её никогда не увидят: ошибки загрузки картинок/скриптов
      не считаются фатальными, а React вшит в этот файл и не зависит от CDN.
    -->
    <script>
      (function () {
        var debug = false;
        try {
          debug =
            /[?&]debug=1/.test(location.search) ||
            /tgWebAppStartParam=debug/.test(location.hash + location.search);
        } catch (e) {}
        window.__nfDebug = debug;
        if (!debug) return;
        function show(msg) {
          try {
            var d = document.createElement("div");
            d.style.cssText =
              "position:fixed;top:0;left:0;right:0;z-index:99999;background:#6E1414;color:#fff;font:12px/1.5 ui-monospace,monospace;padding:10px 12px;white-space:pre-wrap;word-break:break-all;max-height:45vh;overflow:auto";
            d.textContent = msg;
            d.onclick = function () {
              d.remove();
            };
            (document.body || document.documentElement).appendChild(d);
          } catch (e) {}
        }
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (t && t !== window && t.tagName) return; // ресурсы (img/script) — не фатально
            show("⚠ " + (e.message || "Ошибка") + (e.filename ? "\n" + String(e.filename).split("/").pop() + ":" + e.lineno : ""));
          },
          true
        );
        window.addEventListener("unhandledrejection", function (e) {
          show("⚠ promise: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
        });
      })();
    </script>

 Гантели скользят строго вдоль бедер не ниже середины голени."},{key:"row",equipment:"db",pattern:"h_pull",type:"big",restSec:90,starter:7.5,name:"Тяга гантели с упором",short:"тяга",reps:"10–12 повторов",gif:"./gifs/row.gif",muscles:["lats","traps-middle","rear-shoulders","biceps"],tip:"Важно: делайте с упором свободной рукой и коленом в скамью или диван! Опора снимает нагрузку с поясницы на 100%. Корпус почти параллелен полу, тяните гантель к поясу, сжимая широчайшую мышцу и сводя лопатку."},{key:"floor",equipment:"db",pattern:"h_push",type:"big",restSec:90,starter:7.5,name:"Жим гантелей лёжа",short:"жим лёжа",reps:"10–12 повторов",gif:"./gifs/floor.gif",muscles:["chest","front-shoulders","triceps"],tip:"Лёжа на скамье или на коврике на полу: лопатки сведены, поясница стабильна, локти под углом ~45° к корпусу. Выжимайте гантели вверх над грудью и плавно опускайте до уровня груди (или лёгкого касания пола плечами)."},{key:"ohp",equipment:"db",pattern:"v_push",type:"big",restSec:75,starter:5,name:"Жим гантелей стоя над головой",short:"жим вверх",reps:"10–12 повторов",gif:"./gifs/ohp.gif",muscles:["front-shoulders","triceps"],tip:"Стоя, пресс и ягодицы напряжены и зажаты — это страхует поясницу от прогиба назад! Выжимайте гантели вверх от плеч над головой, не отклоняя корпус назад."},{key:"curl",equipment:"db",pattern:"biceps",type:"iso",restSec:60,starter:5,name:"Сгибания на бицепс",short:"бицепс",reps:"12–15 повторов",gif:"./gifs/curl.gif",muscles:["biceps","forearms"],tip:"Стоя, локти зафиксированы у туловища. Поднимайте гантели плавным движением, разворачивая кисти к себе в верхней точке."},{key:"tricep",equipment:"db",pattern:"triceps",type:"iso",restSec:60,starter:5,singleDumbbell:!0,name:"Разгибание на трицепс",short:"трицепс",reps:"12–15 повторов",gif:"./gifs/tricep.gif",muscles:["triceps"],tip:"Возьмите 1 гантель ОБЕИМИ руками за блин, подняв над головой. Опускайте за голову и полностью разгибайте руки вверх."},{key:"shrug",equipment:"db",pattern:"traps",type:"iso",restSec:60,starter:5,name:"Шраги с гантелями",short:"шраги",reps:"12–15 повторов",gif:"./gifs/shrug.gif",muscles:["traps"],tip:"Стоя, гантели в опущенных руках. Поднимайте плечи вверх к ушам без сгибания локтей, задержитесь сверху и плавно опускайте."},{key:"bend",equipment:"db",pattern:"core",type:"iso",restSec:45,starter:5,singleDumbbell:!0,name:"Боковые наклоны с гантелью",short:"наклоны",reps:"12–15 повторов",gif:"./gifs/bend.gif",muscles:["obliques"],tip:"Гантель в одной руке, вторая за головой. Наклоняйтесь строго вбок, работая косыми мышцами живота. Смените руку на половине подходов."},{key:"spell",equipment:"db",pattern:"core",type:"iso",restSec:45,starter:4,name:"Махи гантелями по дуге (кор и косые)",short:"махи на кор",reps:"12–15 повторов",gif:"./gifs/spell.gif",muscles:["abdominals","obliques"],tip:"Держите гантели в обеих руках, колени слегка согнуты, пресс напряжён. Плавно переносите гантели по дуге из стороны в сторону на уровне груди без рывков в пояснице."},{key:"calf",equipment:"db",pattern:"calves",type:"iso",restSec:45,starter:10,name:"Подъёмы на носки с гантелями",short:"икры",reps:"15–20 повторов",gif:"./gifs/calf.gif",muscles:["calves"],tip:"Стоя, гантели в опущенных руках. Поднимайтесь на носки максимально высоко, задержитесь сверху на секунду и медленно опускайтесь."},{key:"bw_squat",equipment:"bw",pattern:"squat",type:"big",restSec:60,starter:0,bodyWeightOnly:!0,name:"Приседания с собственным весом",short:"присед",reps:"15–20 повторов",gif:"./gifs/3119.gif",muscles:["quads","glutes"],tip:"Стопы на ширине плеч, носки чуть врозь. Вытягивайте руки вперёд для баланса, отводите таз назад и приседайте до параллели бедер с полом, держа спину ровной."},{key:"bw_lunge",equipment:"bw",pattern:"squat",type:"big",restSec:60,starter:0,bodyWeightOnly:!0,name:"Выпады на месте",short:"выпады",reps:"12–15 повторов",gif:"./gifs/2368.gif",muscles:["quads","glutes"],tip:"Шаг назад, опускайтесь до прямого угла в переднем колене. Колено передней ноги не уходит далеко вперед за носок."},{key:"bw_bridge",equipment:"bw",pattern:"hinge",type:"big",restSec:60,starter:0,bodyWeightOnly:!0,name:"Ягодичный мостик на полу",short:"мостик",reps:"15–20 повторов",gif:"./gifs/3013.gif",muscles:["glutes","hamstrings"],tip:"Лежа на спине, стопы упираются в пол. Сжимая ягодицы, выталкивайте таз вверх до прямой линии от колен до плеч. В верхней точке задержитесь на 2 секунды."},{key:"bw_pushup",equipment:"bw",pattern:"h_push",type:"big",restSec:75,starter:0,bodyWeightOnly:!0,name:"Классические отжимания от пола",short:"отжимания",reps:"10–15 повторов",gif:"./gifs/0662.gif",muscles:["chest","front-shoulders","triceps"],tip:"Тело как прямая планка от пяток до макушки. Локти направлены назад под 45° к корпусу (не расставляйте локти в стороны). Опускайтесь до легкого касания грудью пола."},{key:"bw_row",equipment:"bw",pattern:"h_pull",type:"big",restSec:75,starter:0,bodyWeightOnly:!0,name:"Австралийские подтягивания",short:"тяга к себе",reps:"10–12 повторов",gif:"./gifs/3167.gif",muscles:["lats","traps-middle","rear-shoulders","biceps"],tip:"Горизонтальная тяга под низкой перекладиной, на шведской стенке или у прочной опоры/стола. Сводите лопатки и тяните грудь к опоре, сохраняя корпус ровным."},{key:"bw_pullup",equipment:"bw",pattern:"v_pull",type:"big",restSec:90,starter:0,bodyWeightOnly:!0,name:"Подтягивания на перекладине",short:"подтягивания",reps:"6–12 повторов",gif:"./gifs/0652.gif",muscles:["lats","biceps","traps-middle"],tip:"Хват чуть шире плеч. Тяните грудь вверх к перекладине, сводя лопатки без рывков. Если под рукой нет турника — замените на австралийскую тягу под крепким столом."},{key:"bw_pike",equipment:"bw",pattern:"v_push",type:"big",restSec:75,starter:0,bodyWeightOnly:!0,name:"Отжимания домиком на плечи",short:"жим домиком",reps:"8–12 повторов",gif:"./gifs/3662.gif",muscles:["front-shoulders","triceps"],tip:"Таз поднят высоко вверх в форме буквы V. Опускайтесь головой вперед по диагонали, нагружая передние и средние пучки дельт."},{key:"bw_bench_dip",equipment:"bw",pattern:"triceps",type:"iso",restSec:60,starter:0,bodyWeightOnly:!0,name:"Обратные отжимания от скамьи",short:"трицепс",reps:"12–15 повторов",gif:"./gifs/0129.gif",muscles:["triceps"],tip:"Руки на краю устойчивого стула или дивана позади корпуса. Опускайтесь, сгибая локти строго назад до прямого угла, и мощно выжимайте себя вверх."},{key:"bw_crunch",equipment:"bw",pattern:"core",type:"iso",restSec:45,starter:0,bodyWeightOnly:!0,name:"Скручивания на пресс",short:"скручивания",reps:"15–20 повторов",gif:"./gifs/0001.gif",muscles:["abdominals"],tip:"Поясница плотно прижата к полу! Скручивайте только верхнюю часть корпуса, приближая ребра к тазу. Не тяните шею руками."},{key:"bw_calf",equipment:"bw",pattern:"calves",type:"iso",restSec:45,starter:0,bodyWeightOnly:!0,name:"Подъёмы на носки на одной ноге",short:"икры",reps:"15–20 повторов",gif:"./gifs/1387.gif",muscles:["calves"],tip:"Стоя на одной ноге у стены для равновесия. Поднимайтесь максимально высоко на носок, пауза 1 секунда сверху, плавно вниз."},{key:"kb_squat",equipment:"kb",pattern:"squat",type:"big",restSec:90,starter:12,singleDumbbell:!0,name:"Кубковые приседания с гирей",short:"присед с гирей",reps:"10–12 повторов",gif:"./gifs/0534.gif",muscles:["quads","glutes"],tip:"Держите гирю за дужку обеими руками у груди. Локти направлены вниз. Приседайте глубоко с прямой спиной, разводя колени в стороны носков."},{key:"kb_swing",equipment:"kb",pattern:"hinge",type:"big",restSec:75,starter:12,singleDumbbell:!0,name:"Махи гирей двумя руками",short:"махи гирей",reps:"15–20 повторов",gif:"./gifs/0549.gif",muscles:["hamstrings","glutes","lowerback"],tip:"Важно: движение выполняется мощным толчком бедер и ягодиц вперед, а не руками или приседом! В нижней точке отводите таз назад с ровной спиной."},{key:"kb_row",equipment:"kb",pattern:"h_pull",type:"big",restSec:90,starter:12,singleDumbbell:!0,name:"Тяга гири в упоре одной рукой",short:"тяга гири",reps:"10–12 повторов",gif:"./gifs/0541.gif",muscles:["lats","traps-middle","rear-shoulders","biceps"],tip:"Упритесь предплечьем свободной руки в бедро (или обопритесь рукой и коленом о скамью) для разгрузки поясницы. Тяните гирю к поясу, направляя локоть назад и вверх."},{key:"kb_floor_press",equipment:"kb",pattern:"h_push",type:"big",restSec:90,starter:12,singleDumbbell:!0,name:"Жим гири с пола одной рукой",short:"жим с пола",reps:"10–12 повторов",gif:"./gifs/1298.gif",muscles:["chest","front-shoulders","triceps"],tip:"Лежа на коврике, гиря лежит на внешней стороне предплечья. Выжимайте гирю вверх над грудью до полного выпрямления руки."},{key:"kb_ohp",equipment:"kb",pattern:"v_push",type:"big",restSec:75,starter:8,singleDumbbell:!0,name:"Жим гири одной рукой стоя",short:"жим гири",reps:"8–10 повторов",gif:"./gifs/0539.gif",muscles:["front-shoulders","triceps"],tip:"Гиря на груди в замке. Пресс зажат. Выжимайте гирю вертикально над головой, плавно вращая кисть наружу."},{key:"kb_core",equipment:"kb",pattern:"core",type:"iso",restSec:45,starter:8,singleDumbbell:!0,name:"«Восьмёрка» с гирей (кор и корпус)",short:"восьмёрка гирей",reps:"12–16 повторов",gif:"./gifs/0532.gif",muscles:["abdominals","obliques"],tip:"Ноги шире плеч в полуприседе, спина строго прямая! Передавайте гирю вокруг ног по траектории восьмёрки, удерживая корпус стабильным за счёт мышц кора."},{key:"bb_squat",equipment:"bb",pattern:"squat",type:"big",restSec:120,starter:30,name:"Приседания со штангой на спине",short:"присед со шт.",reps:"8–10 повторов",gif:"./gifs/0043.gif",muscles:["quads","glutes"],tip:"Гриф на верхней части трапеций. Лопатки сведены. Отводите таз назад, колени по направлению носков, глубина до параллели."},{key:"bb_bench",equipment:"bb",pattern:"h_push",type:"big",restSec:90,starter:30,name:"Жим штанги лёжа",short:"жим штанги",reps:"8–10 повторов",gif:"./gifs/0025.gif",muscles:["chest","front-shoulders","triceps"],tip:"Лопатки сведены и прижаты к скамье. Опускайте гриф под контролем на середину груди, локти под углом 45–60° к телу."},{key:"bb_rdl",equipment:"bb",pattern:"hinge",type:"big",restSec:90,starter:35,name:"Румынская тяга со штангой",short:"румынка со шт.",reps:"8–10 повторов",gif:"./gifs/0085.gif",muscles:["hamstrings","glutes","lowerback"],tip:"Важно: спина зафиксирована прямой. Гриф скользит по ногам не ниже середины голени. Движение строго за счет отведения таза назад."},{key:"bb_row",equipment:"bb",pattern:"h_pull",type:"big",restSec:90,starter:25,name:"Тяга штанги в наклоне к поясу",short:"тяга штанги",reps:"8–10 повторов",gif:"./gifs/0027.gif",muscles:["lats","traps-middle","rear-shoulders","biceps"],tip:"Наклон корпуса ~45°, колени мягкие, спина ровная. Тяните гриф к низу живота, прижимая локти к бокам и сводя лопатки."},{key:"bb_ohp",equipment:"bb",pattern:"v_push",type:"big",restSec:90,starter:20,name:"Армейский жим штанги стоя",short:"армейский жим",reps:"8–10 повторов",gif:"./gifs/1457.gif",muscles:["front-shoulders","triceps"],tip:"Стоя, ягодицы и пресс сжаты для фиксации поясницы. Жмите штангу от груди строго вверх над головой, не прогибаясь в спине."},{key:"bb_curl",equipment:"bb",pattern:"biceps",type:"iso",restSec:60,starter:15,name:"Подъём штанги на бицепс",short:"бицепс со шт.",reps:"10–12 повторов",gif:"./gifs/0031.gif",muscles:["biceps","forearms"],tip:"Локти прижаты к корпусу и не уходят вперед. Поднимайте штангу силой бицепсов без раскачки корпусом."},{key:"bb_close_bench",equipment:"bb",pattern:"triceps",type:"iso",restSec:60,starter:20,name:"Жим штанги узким хватом",short:"узкий жим",reps:"10–12 повторов",gif:"./gifs/0030.gif",muscles:["triceps","chest"],tip:"Хват на ширине плеч (не слишком узко, чтобы беречь запястья). Локти идут близко к корпусу, акцент на трицепс."},{key:"bb_calf",equipment:"bb",pattern:"calves",type:"iso",restSec:45,starter:30,name:"Подъёмы на носки со штангой стоя",short:"икры со шт.",reps:"15–20 повторов",gif:"./gifs/1372.gif",muscles:["calves"],tip:"Штанга на верхней части трапеций. Поднимайтесь на носки максимально высоко с паузой 1 секунду в верхней точке, затем плавно опускайтесь."},{key:"band_squat",equipment:"band",pattern:"squat",type:"big",restSec:60,starter:5,name:"Приседания с эспандером",short:"присед с резинкой",reps:"12–15 повторов",gif:"./gifs/1004.gif",muscles:["quads","glutes"],tip:"Резинка под стопами, верхний край держите у плеч. Приседайте с ровной спиной, преодолевая натяжение резины на подъёме."},{key:"band_rdl",equipment:"band",pattern:"hinge",type:"big",restSec:75,starter:8,name:"Румынская тяга с эспандером",short:"румынка резинка",reps:"12–15 повторов",gif:"./gifs/1009.gif",muscles:["hamstrings","glutes","lowerback"],tip:"Встаньте стопами на середину ленты, спина строго ровная! Отводите таз назад, растягивая заднюю поверхность бедра, и мощно выпрямляйтесь за счёт ягодиц."},{key:"band_press",equipment:"band",pattern:"h_push",type:"big",restSec:60,starter:5,name:"Жим эспандера от груди",short:"жим с резинкой",reps:"12–15 повторов",gif:"./gifs/3124.gif",muscles:["chest","front-shoulders","triceps"],tip:"Сидя или стоя, резина проведена за спиной на уровне лопаток. Выжимайте руки вперед, сжимая грудные мышцы в точке максимального натяжения."},{key:"band_row",equipment:"band",pattern:"h_pull",type:"big",restSec:60,starter:5,name:"Тяга резинки к поясу сидя",short:"тяга с резинкой",reps:"12–15 повторов",gif:"./gifs/3144.gif",muscles:["lats","traps-middle","rear-shoulders","biceps"],tip:"Сидя на коврике с прямыми ногами, резина зацеплена за стопы. Спина прямая. Тяните концы резинки к поясу, сводя лопатки."},{key:"band_lat_pull",equipment:"band",pattern:"v_pull",type:"big",restSec:75,starter:5,name:"Тяга эспандера сверху (широчайшие)",short:"верт. тяга резинка",reps:"12–15 повторов",gif:"./gifs/0974.gif",muscles:["lats","traps-middle","biceps"],tip:"Закрепите резинку наверху (дверной якорь или турник). Сидя или стоя на коленях, тяните рукояти к груди, направляя локти вниз и сводя лопатки."},{key:"band_ohp",equipment:"band",pattern:"v_push",type:"big",restSec:60,starter:5,name:"Жим эспандера над головой",short:"жим плечи резина",reps:"12–15 повторов",gif:"./gifs/0997.gif",muscles:["front-shoulders","triceps"],tip:"Стоя на резинке, держите края у плеч. Выжимайте руки вертикально вверх, сохраняя напряжение в прессе."},{key:"band_curl",equipment:"band",pattern:"biceps",type:"iso",restSec:60,starter:5,name:"Сгибания на бицепс с эспандером",short:"бицепс с резинкой",reps:"12–15 повторов",gif:"./gifs/0968.gif",muscles:["biceps"],tip:"Наступите на резинку, локти прижмите к бокам. Сгибайте руки в локтях с фиксацией пикового сокращения бицепса на 1 секунду."},{key:"band_tricep",equipment:"band",pattern:"triceps",type:"iso",restSec:60,starter:5,name:"Отжимания узким хватом с резинкой",short:"трицепс резинка",reps:"10–15 повторов",gif:"./gifs/0975.gif",muscles:["triceps","chest"],tip:"Проденьте ленту через спину и прижмите концы ладонями к полу чуть уже ширины плеч. Опускайтесь с локтями вдоль корпуса, акцентируя работу трицепсов."},{key:"band_calf",equipment:"band",pattern:"calves",type:"iso",restSec:45,starter:8,name:"Подъёмы на носки с эспандером",short:"икры резинка",reps:"15–20 повторов",gif:"./gifs/1369.gif",muscles:["calves"],tip:"Встаньте обеими ногами на середину эспандера, натяните ручки вдоль бедер и поднимайтесь максимально высоко на носки с секундной паузой."},{key:"band_crunch",equipment:"band",pattern:"core",type:"iso",restSec:45,starter:5,name:"Скручивания «Велосипед» с резинкой",short:"пресс резинка",reps:"15–20 повторов",gif:"./gifs/0972.gif",muscles:["abdominals","obliques"],tip:"Закрепите резинку за стопы и держите концы в руках у головы/груди. Выполняйте подконтрольные перекрестные скручивания, прижимая поясницу к коврику."},{key:"cable_lat_pull",equipment:"cable",pattern:"v_pull",type:"big",restSec:90,starter:35,name:"Тяга верхнего блока к груди",short:"тяга верт. блока",reps:"10–12 повторов",gif:"./gifs/0150.gif",muscles:["lats","traps-middle","biceps"],tip:"Сидя с фиксацией бедер валиками. Хват чуть шире плеч. Слегка отклоните корпус назад (на 10–15°), тяните рукоять к верхней части груди, сводя лопатки."},{key:"cable_row",equipment:"cable",pattern:"h_pull",type:"big",restSec:90,starter:30,name:"Горизонтальная тяга блока к поясу",short:"тяга блока к поясу",reps:"10–12 повторов",gif:"./gifs/0861.gif",muscles:["lats","traps-middle","rear-shoulders","biceps"],tip:"Упритесь стопами в платформу, колени слегка согнуты, спина прямая. Тяните рукоять к низу живота, максимально сводя лопатки назад."},{key:"cable_press",equipment:"cable",pattern:"h_push",type:"big",restSec:90,starter:20,name:"Жим от груди в кроссовере лёжа",short:"жим в кроссовере",reps:"10–12 повторов",gif:"./gifs/0151.gif",muscles:["chest","front-shoulders","triceps"],tip:"Лёжа на скамье между блоками. Плавный контролируемый жим вверх над грудью с пиковым сжатием грудных мышц в верхней точке."},{key:"cable_ohp",equipment:"cable",pattern:"v_push",type:"big",restSec:75,starter:15,name:"Жим над головой в блоке стоя",short:"жим плечи блок",reps:"10–12 повторов",gif:"./gifs/0148.gif",muscles:["front-shoulders","triceps"],tip:"Рукояти от нижних блоков на уровне плеч. Корпус стабилен, пресс напряжен. Выжимайте рукояти вверх поочерёдно или вместе, сохраняя непрерывное натяжение троса."},{key:"cable_curl",equipment:"cable",pattern:"biceps",type:"iso",restSec:60,starter:15,name:"Сгибания на бицепс в блоке с канатом",short:"бицепс в блоке",reps:"12–15 повторов",gif:"./gifs/0165.gif",muscles:["biceps","forearms"],tip:"Локти прижаты к бокам и неподвижны. Сгибайте руки в локтях, разводя кисти в стороны в верхней точке для максимального пика бицепса."},{key:"cable_pushdown",equipment:"cable",pattern:"triceps",type:"iso",restSec:60,starter:20,name:"Разгибания на трицепс в кроссовере",short:"трицепс в блоке",reps:"12–15 повторов",gif:"./gifs/0201.gif",muscles:["triceps"],tip:"Локти строго зафиксированы у туловища. Разгибайте руки вниз до полного выпрямления, напрягая трицепс на 1 секунду."},{key:"cable_deadlift",equipment:"cable  хаммере",reps:"10–12 повторов",gif:"./gifs/0571.gif",muscles:["lats","traps-middle","rear-shoulders","biceps"],tip:"Грудь плотно прижата к подушке упора. Тяните рукояти к поясу, акцентируя сведение лопаток и сокращение широчайших мышц."},{key:"mach_lat_pull",equipment:"mach",pattern:"v_pull",type:"big",restSec:90,starter:30,name:"Вертикальная тяга в рычажном тренажёре",short:"верт. тяга хаммер",reps:"10–12 повторов",gif:"./gifs/0579.gif",muscles:["lats","traps-middle","biceps"],tip:"Плотно зафиксируйте бедра под валиком. Тяните рукояти сверху вниз к плечам/груди, раскрывая грудную клетку и сводя лопатки."},{key:"mach_shoulder_press",equipment:"mach",pattern:"v_push",type:"big",restSec:75,starter:20,name:"Жим на плечи в тренажёре сидя",short:"жим плечи тренажёр",reps:"10–12 повторов",gif:"./gifs/0587.gif",muscles:["front-shoulders","triceps"],tip:"Спина ровно прижата к спинке сиденья. Выжимайте рукояти вверх над головой, не распрямляя локти до щелчка в верхней точке."},{key:"mach_leg_curl",equipment:"mach",pattern:"hinge",type:"big",restSec:75,starter:25,name:"Сгибания ног в тренажёре сидя",short:"сгибания ног",reps:"10–12 повторов",gif:"./gifs/0599.gif",muscles:["hamstrings"],tip:"Валик располагается чуть выше пяток, сверху бедра зафиксированы подушкой. Колени на одной оси с шарниром тренажёра. Сгибайте ноги с максимальным сокращением бицепса бедра."},{key:"mach_bicep",equipment:"mach",pattern:"biceps",type:"iso",restSec:60,starter:15,name:"Сгибания на бицепс в тренажёре",short:"бицепс тренажёр",reps:"12–15 повторов",gif:"./gifs/0592.gif",muscles:["biceps"],tip:"Плечи и трицепсы плотно лежат на парте Скотта. Сгибайте руки вверх, контролируя плавное растяжение бицепса в нижней точке."},{key:"mach_tricep",equipment:"mach",pattern:"triceps",type:"iso",restSec:60,starter:20,name:"Разгибания на трицепс в тренажёре сидя",short:"трицепс тренажёр",reps:"12–15 повторов",gif:"./gifs/0607.gif",muscles:["triceps"],tip:"Локти на опорных подушках. Разгибайте руки вперед-вниз силой трицепса, задерживаясь на полсекунды в точке максимального сокращения."},{key:"mach_calf",equipment:"mach",pattern:"calves",type:"iso",restSec:45,starter:40,name:"Подъёмы на носки в тренажёре (жим ногами)",short:"икры в тренажёре",reps:"15–20 повторов",gif:"./gifs/1391.gif",muscles:["calves"],tip:"Носки на нижнем крае платформы, пятки свисают. Колени зафиксированы с легким микросгибом. Выжимайте платформу исключительно носками стоп."},{key:"mach_crunch",equipment:"mach",pattern:"core",type:"iso",restSec:45,starter:25,name:"Скручивания на пресс в тренажёре",short:"пресс тренажёр",reps:"15–20 повторов",gif:"./gifs/1452.gif",muscles:["abdominals"],tip:"Держитесь за рукояти у плеч. Скручивайте верх корпуса к бедрам исключительно силой мышц брюшного пресса."}],Tt=Object.fromEntries(C1.map(s=>[s.key,s])),$0=["squat","rdl","row","floor","ohp","curl","tricep"],K0=["squat","rdl","calf","bw_squat","bw_lunge","bw_bridge","bw_calf","kb_squat","kb_swing","bb_squat","bb_rdl","bb_calf","band_squat","band_rdl","band_calf","cable_deadlift","cable_calf","mach_leg_press","mach_leg_curl","mach_calf"],J0=["floor","ohp","tricep","bw_pushup","bw_pike","bw_bench_dip","kb_floor_press","kb_ohp","bb_bench","bb_ohp","bb_close_bench","band_press","band_ohp","band_tricep","cable_press","cable_ohp","cable_pushdown","mach_chest_press","mach_shoulder_press","mach_tricep"],F0=["row","curl","shrug","bw_row","bw_pullup","kb_row","bb_row","bb_curl","band_row","band_lat_pull","band_curl","cable_lat_pull","cable_row","cable_curl","mach_row","mach_lat_pull","mach_bicep"],sd=["squat","floor","row","curl","spell"],rd=["rdl","ohp","shrug","tricep","calf","bend"],m2=[{id:"chest",n:"Грудь"},{id:"front-shoulders",n:"Дельта пер."},{id:"rear-shoulders",n:"Дельта зад."},{id:"biceps",n:"Бицепс"},{id:"triceps",n:"Трицепс"},{id:"forearms",n:"Предплечья"},{id:"traps",n:"Трапеции"},{id:"traps-middle",n:"Ср. спина"},{id:"lats",n:"Широчайшие"},{id:"lowerback",n:"Поясница"},{id:"abdominals",n:"Пресс"},{id:"obliques",n:
