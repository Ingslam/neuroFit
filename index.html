<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NeuroFit Трекер</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- React & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #15120F;
      color: #F2EDE7;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
    button, input { font: inherit; }
    @media (max-width: 360px) {
      body { font-size: 15px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // Expand Telegram WebApp view
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    function triggerHaptic(type = "light") {
      try {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
          if (type === "success" || type === "warning" || type === "error") {
            window.Telegram.WebApp.HapticFeedback.notificationOccurred(type);
          } else {
            window.Telegram.WebApp.HapticFeedback.impactOccurred(type);
          }
        }
      } catch (e) {}
    }

    // --- IndexedDB for Private Photo Storage ---
    const DB_NAME = "NeuroFitPhotosDB";
    function openPhotoDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("photos")) {
            db.createObjectStore("photos", { keyPath: "week" });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function savePhotoLocal(week, dataUrl) {
      try {
        const db = await openPhotoDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction("photos", "readwrite");
          const store = tx.objectStore("photos");
          store.put({ week, dataUrl });
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(false);
        });
      } catch (e) { return false; }
    }

    async function getPhotoLocal(week) {
      try {
        const db = await openPhotoDB();
        return new Promise((resolve) => {
          const tx = db.transaction("photos", "readonly");
          const store = tx.objectStore("photos");
          const req = store.get(week);
          req.onsuccess = () => resolve(req.result ? req.result.dataUrl : null);
          req.onerror = () => resolve(null);
        });
      } catch (e) { return null; }
    }

    // --- Storage Sync ---
    const STATE_KEY = "neurofit_state_v2";
    function loadStateStorage() {
      return new Promise((resolve) => {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.CloudStorage) {
          window.Telegram.WebApp.CloudStorage.getItem(STATE_KEY, (err, val) => {
            if (!err && val) {
              try { return resolve(JSON.parse(val)); } catch (e) {}
            }
            fallbackLocal();
          });
        } else {
          fallbackLocal();
        }
        function fallbackLocal() {
          try {
            const val = localStorage.getItem(STATE_KEY);
            if (val) return resolve(JSON.parse(val));
          } catch (e) {}
          resolve(null);
        }
      });
    }

    function saveStateStorage(state) {
      const str = JSON.stringify(state);
      try { localStorage.setItem(STATE_KEY, str); } catch (e) {}
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.CloudStorage) {
        window.Telegram.WebApp.CloudStorage.setItem(STATE_KEY, str);
      }
    }

    const BASE_PHASES = [
      { id: 1, label: "Старт и техника", weeks: [1, 2], sets: { big: 2, iso: 2 },
        weights: { squat: 7.5, rdl: 7.5, row: 7.5, floor: 7.5, ohp: 5, curl: 5, tricep: 5 }, plankSec: 25 },
      { id: 2, label: "Полный объём", weeks: [3, 4, 5], sets: { big: 3, iso: 2 },
        weights: { squat: 7.5, rdl: 7.5, row: 7.5, floor: 7.5, ohp: 5, curl: 5, tricep: 5 }, plankSec: 30 },
      { id: 3, label: "Первое повышение", weeks: [6, 7, 8], sets: { big: 3, iso: 2 },
        weights: { squat: 8.5, rdl: 8.5, row: 8.5, floor: 8.5, ohp: 6, curl: 6, tricep: 6 }, plankSec: 40 },
      { id: 4, label: "Силовой блок", weeks: [9, 10, 11], sets: { big: 3, iso: 2 },
        weights: { squat: 11, rdl: 11, row: 11, floor: 11, ohp: 6, curl: 6, tricep: 6 }, plankSec: 45 },
      { id: 5, label: "Разгрузочная неделя", weeks: [12], sets: { big: 2, iso: 1 },
        weights: { squat: 7.5, rdl: 7.5, row: 7.5, floor: 7.5, ohp: 5, curl: 5, tricep: 5 }, plankSec: 30 },
      { id: 6, label: "Рост после разгрузки", weeks: [13, 14, 15], sets: { big: 3, iso: 2 },
        weights: { squat: 11, rdl: 11, row: 11, floor: 11, ohp: 7.5, curl: 7.5, tricep: 7.5 }, plankSec: 50 },
      { id: 7, label: "Закрепляем силу", weeks: [16, 17, 18], sets: { big: 3, iso: 2 },
        weights: { squat: 12, rdl: 12, row: 12, floor: 12, ohp: 7.5, curl: 7.5, tricep: 7.5 }, plankSec: 55 },
      { id: 8, label: "Финальный блок", weeks: [19, 20, 21], sets: { big: 3, iso: 2 },
        weights: { squat: 12, rdl: 12, row: 12, floor: 12, ohp: 8.5, curl: 8.5, tricep: 8.5 }, plankSec: 60 },
    ];

    function round1(v) { return Math.round(v * 10) / 10; }

    function getPhaseForWeek(week) {
      const found = BASE_PHASES.find((ph) => week >= ph.weeks[0] && week <= ph.weeks[ph.weeks.length - 1]);
      if (found) return found;
      return BASE_PHASES[BASE_PHASES.length - 1];
    }

    function baseNumeric(phase, key) {
      const v = phase.weights[key];
      return typeof v === "number" ? v : 0;
    }

    function effectiveWeight(key, week, overrides) {
      const phase = getPhaseForWeek(week);
      const list = (overrides && overrides[key]) || {};
      const weeks = Object.keys(list).map(Number).filter((w) => w <= week);
      if (weeks.length === 0) return phase.weights[key];
      const overrideWeek = Math.max(...weeks);
      const overrideVal = list[overrideWeek];
      if (overrideVal > 30 || overrideVal < 3) return phase.weights[key];
      const delta = overrideVal - baseNumeric(getPhaseForWeek(overrideWeek), key);
      return round1(baseNumeric(phase, key) + delta);
    }

    function discSetup(weight, singleDumbbell = false) {
      const variants = {
        5: "по 1 диску 1.25 кг с каждой стороны",
        6: "по 1 диску 3 кг с каждой стороны",
        7.5: "по 1 диску 2.5 кг + 1.25 кг с каждой стороны",
        8.5: "по 1 диску 3 кг + 1.25 кг с каждой стороны",
        11: "по 1 диску 3 кг + 2.5 кг с каждой стороны",
        12: "по 2 диска 3 кг с каждой стороны",
      };
      const prefix = singleDumbbell ? "на одну гантель: " : "на каждую гантель: ";
      return variants[weight] ? prefix + variants[weight] : `${prefix}соберите ${weight} кг`;
    }

    const EXERCISES = [
      { key: "squat", name: "Приседания с гантелями", reps: "12–15 повторов", type: "big", restSec: 90,
        videoId: "aclHkTcP9U0",
        tip: "Держи гантели в опущенных руках или у плеч. Спина прямая, таз отводи назад, приседай до параллели бедра с полом.",
        discSetup: (w) => discSetup(w) },
      { key: "rdl", name: "Румынская тяга с гантелями", reps: "10–12 повторов", type: "big", restSec: 90,
        videoId: "JCXUYuzwNrM",
        tip: "Гантели скользят вдоль ног. Мягко согни колени, отводи таз назад и держи спину ровной; почувствуй растяжение задней поверхности бедра.",
        discSetup: (w) => discSetup(w) },
      { key: "row", name: "Тяга гантели в наклоне", reps: "10–12 повторов", type: "big", restSec: 90,
        videoId: "ufhQhwyrx-4",
        tip: "Опрись коленом и рукой на диван/стул. Корпус параллелен полу. Тяни гантель к поясу, ощущая сжатие лопатки.",
        discSetup: (w) => discSetup(w) },
      { key: "floor", name: "Жим гантелей лёжа на полу", reps: "10–12 повторов", type: "big", restSec: 90,
        videoId: "T0Y3OBF1bNI",
        tip: "Лёжа на спине на коврике, ноги согнуты. Локти под углом 45° к корпусу, выжимай гантели вверх над грудью.",
        discSetup: (w) => discSetup(w) },
      { key: "ohp", name: "Жим гантелей стоя над головой", reps: "10–12 повторов", type: "big", restSec: 75,
        videoId: "0JfYxMRsUCQ",
        tip: "Стоя, пресс и ягодицы напряжены. Выжимай гантели вверх от плеч над головой, не прогибая поясницу.",
        discSetup: (w) => discSetup(w) },
      { key: "curl", name: "Сгибания на бицепс", reps: "12–15 повторов", type: "iso", restSec: 60,
        videoId: "NHcg1wuGz84",
        tip: "Стоя, локти зафиксированы у туловища. Поднимай гантели плавным движением, разворачивая кисти к себе.",
        discSetup: (w) => discSetup(w) },
      { key: "tricep", name: "Разгибание на трицепс", reps: "12–15 повторов", type: "iso", restSec: 60,
        videoId: "xbNm9fRoUTw",
        tip: "Возьми 1 гантель ОБЕИМИ руками за блин, подняв над головой. Опускай за голову и полностью разгибай вверх.",
        discSetup: (w) => discSetup(w, true) },
    ];

    const DAYS = [
      { key: "mon", label: "День 1", color: "#C0392B", bgGrad: "linear-gradient(135deg, rgba(192,57,43,0.15) 0%, rgba(29,24,21,1) 100%)" },
      { key: "wed", label: "День 2", color: "#8E44AD", bgGrad: "linear-gradient(135deg, rgba(142,68,173,0.15) 0%, rgba(29,24,21,1) 100%)" },
      { key: "fri", label: "День 3", color: "#2980B9", bgGrad: "linear-gradient(135deg, rgba(41,128,185,0.15) 0%, rgba(29,24,21,1) 100%)" },
    ];

    function workoutFor(phase, week, overrides) {
      const exercisesForWeek = week === 1 ? EXERCISES.filter((ex) => ex.key !== "rdl") : EXERCISES;
      const list = exercisesForWeek.map((ex) => ({
        key: ex.key, name: ex.name, reps: ex.reps, restSec: ex.restSec, tip: ex.tip, discSetup: ex.discSetup, videoId: ex.videoId,
        weight: effectiveWeight(ex.key, week, overrides),
        sets: ex.type === "big" ? phase.sets.big : phase.sets.iso,
      }));
      list.push({ key: "plank", name: "Планка", reps: `${phase.plankSec} сек`, restSec: 60, tip: "Планка на предплечьях. Корпус прямой как натянутая струна, пресс сжат.", videoId: "nEnNoRipej0", weight: null, sets: 3, isTime: true });
      return list;
    }

    function isPhotoWeek(week) { return week % 2 === 1; }

    function emptyChecksForWeek(phase, week, overrides) {
      const wk = workoutFor(phase, week, overrides);
      const perDay = {};
      wk.forEach((ex) => { perDay[ex.key] = Array.from({ length: ex.sets }, () => false); });
      const obj = {};
      DAYS.forEach((d) => { obj[d.key] = JSON.parse(JSON.stringify(perDay)); });
      return obj;
    }

    function compressImage(file, maxDim = 800, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
            else if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
            const canvas = document.createElement("canvas");
            canvas.width = width; canvas.height = height;
            canvas.getContext("2d").drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    const C = {
      bg: "#15120F", surface: "#1D1815", surfaceRaised: "#241E19", border: "#332B24",
      accent: "#C0392B", accentDim: "#5A241D", accentSoft: "#3A2621",
      done: "#4C9A6B", text: "#F2EDE7", textMuted: "#A79D92", textFaint: "#6E655B",
    };

    function ImageModal({ src, onClose }) {
      if (!src) return null;
      return (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.92)", zIndex: 1000, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}
             onClick={onClose}>
          <div style={{ position: "relative", maxWidth: "100%", maxHeight: "90vh", display: "flex", flexDirection: "column", alignItems: "center" }}
               onClick={(e) => e.stopPropagation()}>
            <button onClick={onClose} style={{ position: "absolute", top: -40, right: 0, background: "none", border: "none", color: "#fff", fontSize: 28, cursor: "pointer", padding: 4 }}>✕</button>
            <img src={src} alt="Просмотр фото" style={{ maxWidth: "100%", maxHeight: "82vh", borderRadius: 12, objectFit: "contain", boxShadow: "0 8px 30px rgba(0,0,0,0.8)" }} />
            <div style={{ marginTop: 10, fontSize: 13, color: C.textMuted }}>Нажмите в любом месте, чтобы закрыть</div>
          </div>
        </div>
      );
    }

    function InfoModal({ exercise, onClose }) {
      if (!exercise) return null;

      return (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.85)", zIndex: 999, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}
             onClick={onClose}>
          <div style={{ background: C.surface, border: `1px solid ${C.accent}`, borderRadius: 16, padding: "20px 20px", maxWidth: 440, width: "100%", color: C.text, maxHeight: "90vh", overflowY: "auto" }}
               onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
              <span style={{ fontSize: 17, fontWeight: 800, color: C.accent }}>{exercise.name}</span>
              <button onClick={onClose} style={{ background: "none", border: "none", color: C.textMuted, fontSize: 22, cursor: "pointer", padding: "0 4px" }}>✕</button>
            </div>

            {exercise.videoId && (
              <div style={{ width: "100%", aspectRatio: "16 / 9", background: "#110E0C", borderRadius: 12, overflow: "hidden", marginBottom: 14, border: `1px solid ${C.border}` }}>
                <iframe
                  title={`Техника: ${exercise.name}`}
                  width="100%"
                  height="100%"
                  src={`https://www.youtube-nocookie.com/embed/${exercise.videoId}?rel=0&playsinline=1`}
                  style={{ border: 0 }}
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                  allowFullScreen
                />
              </div>
            )}

            {exercise.discSetup && (
              <div style={{ background: C.surfaceRaised, padding: "10px 12px", borderRadius: 8, marginBottom: 12, fontSize: 13, color: C.text }}>
                💡 <b>Сборка гантели:</b> {exercise.discSetup(exercise.weight)}
              </div>
            )}
            <div style={{ fontSize: 13.5, color: C.textMuted, lineHeight: 1.5, marginBottom: 14 }}>
              📌 <b>Техника выполнения:</b><br />
              {exercise.tip || "Следите за прямой спиной и плавным темпом движения."}
            </div>
            <div style={{ fontSize: 12.5, color: C.textFaint }}>
              ⏱ Рекомендуемый отдых между подходами: <b>{exercise.restSec || 60} сек</b>
            </div>
            <button onClick={onClose} style={{ width: "100%", marginTop: 16, padding: "12px 0", background: C.accent, color: "#fff", border: "none", borderRadius: 10, fontWeight: 700, fontSize: 14, cursor: "pointer" }}>
              Понятно
            </button>
          </div>
        </div>
      );
    }

    function PlateBadge({ week, weeksIntoPhase, phaseLength }) {
      const r = 92;
      return (
        <div style={{ position: "relative", width: 124, height: 124, flexShrink: 0, margin: "0 auto" }}>
          <svg viewBox="0 0 200 200" width="124" height="124">
            <circle cx="100" cy="100" r={r} fill={C.accentDim} stroke={C.accent} strokeWidth="3" />
            <circle cx="100" cy="100" r={r - 14} fill="none" stroke={C.accent} strokeWidth="1.5" opacity="0.5" />
            <circle cx="100" cy="100" r={r - 28} fill="none" stroke={C.accent} strokeWidth="1.5" opacity="0.35" />
            <circle cx="100" cy="100" r="34" fill={C.bg} stroke={C.accent} strokeWidth="2" />
          </svg>
          <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", color: C.text }}>
            <span style={{ fontSize: 8.5, letterSpacing: "0.18em", color: C.textMuted, fontWeight: 700, marginBottom: -2 }}>НЕДЕЛЯ</span>
            <span style={{ fontSize: 30, fontWeight: 900, lineHeight: 1 }}>{week}</span>
          </div>
          <div style={{ position: "absolute", bottom: -6, left: "50%", transform: "translateX(-50%)", display: "flex", gap: 5 }}>
            {Array.from({ length: phaseLength }, (_, i) => (
              <span key={i} style={{ width: 7, height: 7, borderRadius: 9999, background: i < weeksIntoPhase ? C.accent : "transparent", border: `1.5px solid ${C.accent}` }} />
            ))}
          </div>
        </div>
      );
    }

    function WeekNavigationHeader({ week, maxWeeks = 21, onNudge, isCompleted }) {
      return (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: "8px 12px", marginBottom: 14 }}>
          <button
            onClick={() => { if (week > 1) { triggerHaptic("light"); onNudge(-1); } }}
            disabled={week <= 1}
            style={{
              background: week <= 1 ? "transparent" : C.surfaceRaised,
              border: `1px solid ${week <= 1 ? "transparent" : C.border}`,
              borderRadius: 8, padding: "8px 14px", color: week <= 1 ? C.textFaint : C.text,
              fontSize: 13, fontWeight: 700, cursor: week <= 1 ? "not-allowed" : "pointer",
              display: "flex", alignItems: "center", gap: 4, transition: "background 150ms"
            }}>
            ‹ Пред.
          </button>

          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 14, fontWeight: 800, color: C.text }}>
              Неделя {week} <span style={{ color: C.textMuted, fontWeight: 500, fontSize: 12 }}>из {maxWeeks}</span>
            </div>
            {isCompleted ? (
              <div style={{ fontSize: 11, color: C.done, fontWeight: 700, marginTop: 1 }}>✓ Завершена</div>
            ) : (
              <div style={{ fontSize: 11, color: "#E67E22", fontWeight: 600, marginTop: 1 }}>В процессе</div>
            )}
          </div>

          <button
            onClick={() => { if (week < maxWeeks) { triggerHaptic("light"); onNudge(1); } }}
            disabled={week >= maxWeeks}
            style={{
              background: week >= maxWeeks ? "transparent" : C.surfaceRaised,
              border: `1px solid ${week >= maxWeeks ? "transparent" : C.border}`,
              borderRadius: 8, padding: "8px 14px", color: week >= maxWeeks ? C.textFaint : C.text,
              fontSize: 13, fontWeight: 700, cursor: week >= maxWeeks ? "not-allowed" : "pointer",
              display: "flex", alignItems: "center", gap: 4, transition: "background 150ms"
            }}>
            След. ›
          </button>
        </div>
      );
    }

    function CheckBox({ checked, onClick, size = 24 }) {
      return (
        <button onClick={onClick} aria-pressed={checked} style={{
          width: size, height: size, borderRadius: 6, flexShrink: 0, cursor: "pointer",
          border: `2px solid ${checked ? C.done : C.textMuted}`, background: checked ? C.done : "transparent",
          display: "flex", alignItems: "center", justifyContent: "center", padding: 0,
          transition: "background 150ms, border-color 150ms"
        }}>
          {checked && <svg width={size * 0.6} height={size * 0.6} viewBox="0 0 20 20" fill="none">
            <path d="M4 10.5L8 14.5L16 5.5" stroke={C.bg} strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round" /></svg>}
        </button>
      );
    }

    function RestTimer({ durationSec, onFinish, isLast }) {
      const [secondsLeft, setSecondsLeft] = useState(durationSec);

      useEffect(() => {
        if (secondsLeft <= 0) {
          if (onFinish) onFinish();
          return;
        }
        const timer = setInterval(() => {
          setSecondsLeft((s) => s - 1);
        }, 1000);
        return () => clearInterval(timer);
      }, [secondsLeft]);

      if (secondsLeft <= 0) {
        return (
          <span style={{ fontSize: 11, color: C.done, fontWeight: 700, padding: "2px 6px", borderRadius: 4, background: "rgba(76,154,107,0.15)" }}>
            ✓ {isLast ? "Пора к следующему упражнению!" : "Пора к подходу!"}
          </span>
        );
      }

      return (
        <span style={{ fontSize: 11, color: "#E67E22", fontWeight: 700, padding: "2px 6px", borderRadius: 4, background: "rgba(230,126,34,0.15)", fontFamily: "ui-monospace, monospace" }}>
          ⏱ Отдых: {secondsLeft}с
        </span>
      );
    }

    function announceRestEnd() {
      triggerHaptic("success");
      try {
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
          const phrase = new SpeechSynthesisUtterance("Let's go, go, go!");
          phrase.lang = "en-US";

    function Roadmap({ currentWeek, overrides }) {
      const [open, setOpen] = useState(false);
      const rows = [];
      for (let w = 1; w <= 21; w++) {
        const ph = getPhaseForWeek(w);
        if (rows.length === 0 || rows[rows.length - 1].id !== ph.id) {
          rows.push({ id: ph.id, label: ph.label, weeks: ph.weeks, phase: ph });
        }
      }

      return (
        <div style={{ marginTop: 18, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: "14px 16px" }}>
          <button onClick={() => { triggerHaptic("selection"); setOpen((v) => !v); }} style={{ background: "none", border: "none", color: C.text, fontSize: 14.5, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "space-between", width: "100%", padding: 0 }}>
            <span>🗺️ План тренировок на 21 неделю</span>
            <span style={{ color: C.textMuted, fontSize: 12 }}>{open ? "свернуть ⌃" : "показать ⌄"}</span>
          </button>

          {open && (
            <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 10 }}>
              {rows.map((r) => {
                const active = currentWeek >= r.weeks[0] && currentWeek <= r.weeks[r.weeks.length - 1];
                const midWeek = r.weeks[0];
                const squatW = effectiveWeight("squat", midWeek, overrides);
                const floorW = effectiveWeight("floor", midWeek, overrides);
                const ohpW = effectiveWeight("ohp", midWeek, overrides);

                return (
                  <div key={r.id} style={{
                    background: active ? C.accentSoft : C.surfaceRaised,
                    border: `1px solid ${active ? C.accent : C.border}`,
                    borderRadius: 10, padding: "10px 12px",
                    display: "flex", flexDirection: "column", gap: 6
                  }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <span style={{ fontSize: 13.5, fontWeight: 800, color: active ? C.text : C.textMuted }}>
                        Недели {r.weeks[0]}–{r.weeks[r.weeks.length - 1]}: <span style={{ color: active ? C.accent : C.text }}>{r.label}</span>
                      </span>
                      {active && (
                        <span style={{ fontSize: 10, fontWeight: 800, padding: "2px 6px", borderRadius: 4, background: C.accent, color: "#fff", textTransform: "uppercase" }}>
                          Сейчас
                        </span>
                      )}
                    </div>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: "6px 12px", fontSize: 12, color: C.textMuted, fontFamily: "ui-monospace, monospace" }}>
                      <span>🏋️ Присед/Тяга: <b style={{ color: C.text }}>{squatW} кг</b></span>
                      <span>💪 Жим лежа: <b style={{ color: C.text }}>{floorW} кг</b></span>
                      <span>🙆 Жим плечи: <b style={{ color: C.text }}>{ohpW} кг</b></span>
                      <span>⏱ Планка: <b style={{ color: C.text }}>{r.phase.plankSec} сек</b></span>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [week, setWeek] = useState(1);
      const [overrides, setOverrides] = useState({});
      const [checksByWeek, setChecksByWeek] = useState({});
      const [bodyWeightLog, setBodyWeightLog] = useState({});
      const [photoWeeks, setPhotoWeeks] = useState([]);
      const [completedWeeks, setCompletedWeeks] = useState({});
      const [currentPhotoUrl, setCurrentPhotoUrl] = useState(null);
      const [photoBusy, setPhotoBusy] = useState(false);
      const [loaded, setLoaded] = useState(false);
      const [justAdvanced, setJustAdvanced] = useState(false);
      const [modalExercise, setModalExercise] = useState(null);
      const [previewImage, setPreviewImage] = useState(null);
      const [weightIncreasedMsg, setWeightIncreasedMsg] = useState("");
      const advancingRef = useRef(false);

      useEffect(() => {
        (async () => {
          const saved = await loadStateStorage();
          if (saved) {
            const initialWeek = saved.week || 1;
            setWeek(initialWeek);
            
            let cleanOverrides = saved.overrides || {};
            if (!saved.schemaVersion || saved.schemaVersion < 4) {
              cleanOverrides = {};
            }
            setOverrides(cleanOverrides);

            // Migration to checksByWeek: preserve existing checks for the saved week
            let initialChecksByWeek = saved.checksByWeek || {};
            if (saved.checks && Object.keys(saved.checks).length > 0 && !saved.checksByWeek) {
              initialChecksByWeek[initialWeek] = saved.checks;
            }
            setChecksByWeek(initialChecksByWeek);

            setBodyWeightLog(saved.bodyWeightLog || {});
            setPhotoWeeks(saved.photoWeeks || []);
            setCompletedWeeks(saved.completedWeeks || {});
          }
          setLoaded(true);
        })();
      }, []);

      useEffect(() => {
        if (!loaded) return;
        saveStateStorage({ schemaVersion: 5, week, overrides, checksByWeek, bodyWeightLog, photoWeeks, completedWeeks });
      }, [week, overrides, checksByWeek, bodyWeightLog, photoWeeks, completedWeeks, loaded]);

      useEffect(() => {
        if (loaded) {
          getPhotoLocal(week).then(setCurrentPhotoUrl);
        }
      }, [week, loaded]);

      const phase = getPhaseForWeek(week);
      const weeksIntoPhase = week - phase.weeks[0] + 1;

      // Current week's checks from checksByWeek
      const currentChecks = useMemo(() => {
        if (checksByWeek[week]) return checksByWeek[week];
        return emptyChecksForWeek(phase, week, overrides);
      }, [checksByWeek, week, phase, overrides]);

      const isCurrentWeekDone = useMemo(() => {
        const list = workoutFor(phase, week, overrides);
        return DAYS.every((d) => currentChecks[d.key] && list.every((ex) => currentChecks[d.key][ex.key] && currentChecks[d.key][ex.key].every(Boolean)));
      }, [phase, week, overrides, currentChecks]);

      useEffect(() => {
        if (isCurrentWeekDone && !advancingRef.current && loaded) {
          advancingRef.current = true;
          setCompletedWeeks((previous) => ({ ...previous, [week]: new Date().toISOString() }));
          if (week >= 21) return;
          
          const nextWeek = week + 1;
          const currentPhase = getPhaseForWeek(week);
          const nextPhase = getPhaseForWeek(nextWeek);
          
          let increased = false;
          if (nextPhase.weights.squat > currentPhase.weights.squat || nextPhase.weights.ohp > currentPhase.weights.ohp) {
            increased = true;
          }

          setJustAdvanced(true);
          const t = setTimeout(() => {
            setWeek(nextWeek);
            // We do NOT overwrite previous week's checks! We simply ensure nextWeek exists in checksByWeek
            setChecksByWeek((prev) => {
              if (prev[nextWeek]) return prev;
              return { ...prev, [nextWeek]: emptyChecksForWeek(nextPhase, nextWeek, overrides) };
            });
            
            if (increased) {
              setWeightIncreasedMsg(`💪 Неделя ${nextWeek}: веса увеличены! Проверьте новые значения.`);
              triggerHaptic("warning");
            } else {
              setWeightIncreasedMsg("");
              triggerHaptic("success");
            }
            
            advancingRef.current = false;
            setJustAdvanced(false);
          }, 1200);
          return () => clearTimeout(t);
        }
      }, [isCurrentWeekDone, loaded, week, overrides]);

      const toggleSet = useCallback((dayKey, exKey, idx) => {
        setChecksByWeek((prev) => {
          const next = JSON.parse(JSON.stringify(prev));
          if (!next[week]) next[week] = emptyChecksForWeek(getPhaseForWeek(week), week, overrides);
          if (!next[week][dayKey]) next[week][dayKey] = {};
          if (!next[week][dayKey][exKey]) next[week][dayKey][exKey] = [];
          next[week][dayKey][exKey][idx] = !next[week][dayKey][exKey][idx];
          return next;
        });
      }, [week, overrides]);

      const toggleAll = useCallback((dayKey, value) => {
        setChecksByWeek((prev) => {
          const next = JSON.parse(JSON.stringify(prev));
          if (!next[week]) next[week] = emptyChecksForWeek(getPhaseForWeek(week), week, overrides);
          if (!next[week][dayKey]) return prev;
          Object.keys(next[week][dayKey]).forEach((k) => {
            next[week][dayKey][k] = next[week][dayKey][k].map(() => value);
          });
          return next;
        });
      }, [week, overrides]);

      const changeBodyWeight = useCallback((val) => {
        setBodyWeightLog((prev) => { const next = { ...prev }; if (val == null) delete next[week]; else next[week] = val; return next; });
      }, [week]);

      const pickPhoto = useCallback(async (file) => {
        setPhotoBusy(true);
        try {
          const dataUrl = await compressImage(file);
          await savePhotoLocal(week, dataUrl);
          setCurrentPhotoUrl(dataUrl);
          setPhotoWeeks((prev) => (prev.includes(week) ? prev : [...prev, week].sort((a, b) => a - b)));
        } finally { setPhotoBusy(false); }
      }, [week]);

      const resetAll = () => {
        if (!window.confirm("Сбросить весь прогресс и начать с недели 1?")) return;
        setWeek(1); setOverrides({}); setChecksByWeek({}); setBodyWeightLog({}); setPhotoWeeks([]); setCurrentPhotoUrl(null); setCompletedWeeks({}); setWeightIncreasedMsg("");
      };

      const nudgeWeek = (delta) => {
        const w = Math.max(1, Math.min(21, week + delta));
        setWeek(w);
        setWeightIncreasedMsg("");
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      if (!loaded) return <div style={{ background: C.bg, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: C.textMuted, fontSize: 16 }}>Загрузка трекера…</div>;

      return (
        <div style={{ background: C.bg, minHeight: "100vh", color: C.text, padding: "16px 14px 50px" }}>
          <div style={{ maxWidth: 600, margin: "0 auto" }}>
            
            {/* Top Week Switcher / Navigation Header */}
            <WeekNavigationHeader week={week} maxWeeks={21} onNudge={nudgeWeek} isCompleted={isCurrentWeekDone || !!completedWeeks[week]} />

            <div style={{ textAlign: "center", marginBottom: 16 }}>
              <PlateBadge week={week} weeksIntoPhase={weeksIntoPhase} phaseLength={phase.weeks.length} />
              <div style={{ marginTop: 12 }}>
                <div style={{ fontSize: 12, letterSpacing: "0.14em", color: C.accent, fontWeight: 800, marginBottom: 4 }}>{phase.label.toUpperCase()}</div>
                <div style={{ fontSize: 12.5, color: C.textMuted }}>Нажмите ⓘ для просмотра видео идеальной техники.</div>
                {justAdvanced && (
                  <div style={{ marginTop: 10, padding: "8px 14px", background: "rgba(76,154,107,0.2)", border: `1px solid ${C.done}`, borderRadius: 8, fontSize: 13.5, color: C.done, fontWeight: 700 }}>
                    🎉 Отличная работа! Тренировка завершена. Переходим дальше…
                  </div>
                )}
                {weightIncreasedMsg && !justAdvanced && (
                  <div style={{ marginTop: 10, padding: "8px 14px", background: "rgba(192,57,43,0.15)", border: `1px solid ${C.accent}`, borderRadius: 8, fontSize: 13.5, color: "#fff", fontWeight: 700 }}>
                    {weightIncreasedMsg}
                  </div>
                )}
              </div>
            </div>

            <ProgressPanel week={week} overrides={overrides} bodyWeightLog={bodyWeightLog} photoWeeks={photoWeeks} completedWeeks={completedWeeks} getPhotoLocal={getPhotoLocal} onPreviewImage={setPreviewImage} />

            {DAYS.map((d, index) => {
              const allDaysStatuses = DAYS.map(dayInfo => {
                const l = workoutFor(phase, week, overrides);
                return currentChecks[dayInfo.key] && l.every((ex) => currentChecks[dayInfo.key][ex.key] && currentChecks[dayInfo.key][ex.key].every(Boolean));
              });
              
              const firstUndoneIndex = allDaysStatuses.indexOf(false);
              const shouldBeOpen = firstUndoneIndex === -1 ? (index === 0) : (index === firstUndoneIndex);

              return (
                <DayCard key={`${week}-${d.key}`} day={d} phase={phase} week={week} overrides={overrides} checksForDay={currentChecks[d.key]}
                  onToggleSet={toggleSet} onToggleAll={toggleAll}
                  bodyWeight={bodyWeightLog[week] ?? null} onBodyWeightChange={changeBodyWeight}
                  currentPhotoUrl={currentPhotoUrl} onPhotoPick={pickPhoto} photoBusy={photoBusy}
                  onOpenInfo={setModalExercise} defaultOpen={shouldBeOpen} onPreviewImage={setPreviewImage} />
              )
            })}

            <Roadmap currentWeek={week} overrides={overrides} />

            <div style={{ marginTop: 24, paddingTop: 16, borderTop: `1px solid ${C.border}`, display: "flex", gap: 10, flexWrap: "wrap", justifyContent: "center" }}>
              <button onClick={() => nudgeWeek(-1)} disabled={week <= 1}
                style={{ ...ghostBtn, opacity: week <= 1 ? 0.3 : 1, cursor: week <= 1 ? "not-allowed" : "pointer" }}>
                ‹ Неделя {Math.max(1, week - 1)}
              </button>
              <span style={{ color: C.textFaint }}>•</span>
              <button onClick={() => nudgeWeek(1)} disabled={week >= 21}
                style={{ ...ghostBtn, opacity: week >= 21 ? 0.3 : 1, cursor: week >= 21 ? "not-allowed" : "pointer" }}>
                Неделя {Math.min(21, week + 1)} ›
              </button>
              <span style={{ color: C.textFaint }}>•</span>
              <button onClick={resetAll} style={{ ...ghostBtn, color: C.accent }}>Начать заново</button>
            </div>
          </div>

          {/* Modals */}
          <InfoModal exercise={modalExercise} onClose={() => setModalExercise(null)} />
          <ImageModal src={previewImage} onClose={() => setPreviewImage(null)} />
        </div>
      );
    }

    const ghostBtn = { background: "none", border: "none", color: "#A79D92", fontSize: 12.5, cursor: "pointer", padding: "4px 6px", textDecoration: "underline", textUnderlineOffset: 3 };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
