<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#15120F" />
    <title>NeuroFit Трекер</title>

    <!--
      Отладочная ловушка ошибок.
      Показывается ТОЛЬКО если открыть с ?debug=1 или через deep-link ?startapp=debug.
      Обычные пользователи её никогда не увидят: ошибки загрузки картинок/скриптов
      не считаются фатальными, а React вшит в этот файл и не зависит от CDN.
    -->
    <script>
      (function () {
        var debug = false;
        try {
          debug =
            /[?&]debug=1/.test(location.search) ||
            /tgWebAppStartParam=debug/.test(location.hash + location.search);
        } catch (e) {}
        window.__nfDebug = debug;
        if (!debug) return;
        function show(msg) {
          try {
            var d = document.createElement("div");
            d.style.cssText =
              "position:fixed;top:0;left:0;right:0;z-index:99999;background:#6E1414;color:#fff;font:12px/1.5 ui-monospace,monospace;padding:10px 12px;white-space:pre-wrap;word-break:break-all;max-height:45vh;overflow:auto";
            d.textContent = msg;
            d.onclick = function () {
              d.remove();
            };
            (document.body || document.documentElement).appendChild(d);
          } catch (e) {}
        }
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (t && t !== window && t.tagName) return; // ресурсы (img/script) — не фатально
            show("⚠ " + (e.message || "Ошибка") + (e.filename ? "\n" + String(e.filename).split("/").pop() + ":" + e.lineno : ""));
          },
          true
        );
        window.addEventListener("unhandledrejection", function (e) {
          show("⚠ promise: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
        });
      })();
    </script>

f",muscles:["lats","traps-middle","rear-shoulders","biceps"],tip:"⚠️ ВАЖНО: делайте ТОЛЬКО с упором одной рукой и коленом в диван или скамью! Опора снимает нагрузку с поясницы на 100%. Корпус параллелен полу, тяните гантель к поясу, сжимая широчайшую мышцу и сводя лопатку."},{key:"floor",equipment:"db",pattern:"h_push",type:"big",restSec:90,starter:7.5,name:"Жим гантелей лёжа",short:"жим лёжа",reps:"10–12 повторов",gif:"./gifs/floor.gif",muscles:["chest","front-shoulders","triceps"],tip:"Лёжа на спине на коврике, поясница прижата к полу. Локти под углом 45° к корпусу. Выжимайте гантели вверх над грудью, плавно опуская до касания плечами пола."},{key:"ohp",equipment:"db",pattern:"v_push",type:"big",restSec:75,starter:5,name:"Жим гантелей стоя над головой",short:"жим вверх",reps:"10–12 повторов",gif:"./gifs/ohp.gif",muscles:["front-shoulders","triceps"],tip:"Стоя, пресс и ягодицы напряжены и зажаты — это страхует поясницу от прогиба назад! Выжимайте гантели вверх от плеч над головой, не отклоняя корпус назад."},{key:"curl",equipment:"db",pattern:"biceps",type:"iso",restSec:60,starter:5,name:"Сгибания на бицепс",short:"бицепс",reps:"12–15 повторов",gif:"./gifs/curl.gif",muscles:["biceps","forearms"],tip:"Стоя, локти зафиксированы у туловища. Поднимай гантели плавным движением, разворачивая кисти к себе в верхней точке."},{key:"tricep",equipment:"db",pattern:"triceps",type:"iso",restSec:60,starter:5,singleDumbbell:!0,name:"Разгибание на трицепс",short:"трицепс",reps:"12–15 повторов",gif:"./gifs/tricep.gif",muscles:["triceps"],tip:"Возьми 1 гантель ОБЕИМИ руками за блин, подняв над головой. Опускай за голову и полностью разгибай руки вверх."},{key:"shrug",equipment:"db",pattern:"h_pull",type:"iso",restSec:60,starter:5,name:"Шраги с гантелями",short:"шраги",reps:"12–15 повторов",gif:"./gifs/shrug.gif",muscles:["traps"],tip:"Стоя, гантели в опущенных руках. Поднимай плечи вверх к ушам, без сгибания локтей, задержись сверху и плавно опускай."},{key:"bend",equipment:"db",pattern:"core",type:"iso",restSec:45,starter:5,singleDumbbell:!0,name:"Боковые наклоны с гантелью",short:"наклоны",reps:"12–15 повторов",gif:"./gifs/bend.gif",muscles:["obliques"],tip:"Гантель в одной руке, вторая за головой. Наклоняйся строго вбок, работая косыми мышцами живота. Смени руку на половине подходов."},{key:"spell",equipment:"db",pattern:"core",type:"iso",restSec:45,starter:5,singleDumbbell:!0,name:"Повороты корпуса с гантелью",short:"пресс",reps:"12–15 повторов",gif:"./gifs/spell.gif",muscles:["abdominals","obliques"],tip:"Гантель обеими руками перед грудью. Поворачивай корпус по дуге в сторону, перенося вес на одну ногу, затем в другую."},{key:"calf",equipment:"db",pattern:"calves",type:"iso",restSec:45,starter:10,name:"Подъёмы на носки с гантелями",short:"икры",reps:"15–20 повторов",gif:"./gifs/calf.gif",muscles:["calves"],tip:"Стоя, гантели в опущенных руках. Поднимайся на носки максимально высоко, задержись сверху на секунду и медленно опускайся."},{key:"bw_squat",equipment:"bw",pattern:"squat",type:"big",restSec:60,starter:0,bodyWeightOnly:!0,name:"Воздушные приседания",short:"присед",reps:"15–20 повторов",gif:"./gifs/1685.gif",muscles:["quads","glutes"],tip:"Стопы на ширине плеч, носки чуть врозь. Руки перед собой для баланса. Отводите таз назад и приседайте до параллели бедер с полом, держа спину ровной."},{key:"bw_lunge",equipment:"bw",pattern:"squat",type:"big",restSec:60,starter:0,bodyWeightOnly:!0,name:"Выпады на месте",short:"выпады",reps:"12–15 повторов",gif:"./gifs/2368.gif",muscles:["quads","glutes"],tip:"Шаг назад, опускайтесь до прямого угла в переднем колене. Колено передней ноги не уходит далеко вперед за носок."},{key:"bw_bridge",equipment:"bw",pattern:"hinge",type:"big",restSec:60,starter:0,bodyWeightOnly:!0,name:"Ягодичный мостик на полу",short:"мостик",reps:"15–20 повторов",gif:"./gifs/3013.gif",muscles:["glutes","hamstrings"],tip:"Лежа на спине, стопы упираются в пол. Сжимая ягодицы, выталкивайте таз вверх до прямой линии от колен до плеч. В верхней точке задержитесь на 2 секунды."},{key:"bw_pushup",equipment:"bw",pattern:"h_push",type:"big",restSec:75,starter:0,bodyWeightOnly:!0,name:"Классические отжимания от пола",short:"отжимания",reps:"10–15 повторов",gif:"./gifs/0662.gif",muscles:["chest","front-shoulders","triceps"],tip:"Тело как прямая планка от пяток до макушки. Локти направлены назад под 45° к корпусу (не расставляйте локти в стороны). Опускайтесь до легкого касания грудью пола."},{key:"bw_row",equipment:"bw",pattern:"h_pull",type:"big",restSec:75,starter:0,bodyWeightOnly:!0,name:"Австралийские подтягивания",short:"тяга к себе",reps:"10–12 повторов",gif:"./gifs/3167.gif",muscles:["lats","traps-middle","biceps"],tip:"Горизонтальная тяга под низкой перекладиной или краем крепкого стола. Сводите лопатки и тяните грудь к перекладине."},{key:"bw_pike",equipment:"bw",pattern:"v_push",type:"big",restSec:75,starter:0,bodyWeightOnly:!0,name:"Отжимания домиком на плечи",short:"жим домиком",reps:"8–12 повторов",gif:"./gifs/3662.gif",muscles:["front-shoulders","triceps"],tip:"Таз поднят высоко вверх в форме буквы V. Опускайтесь головой вперед по диагонали, нагружая передние и средние пучки дельт."},{key:"bw_bench_dip",equipment:"bw",pattern:"triceps",type:"iso",restSec:60,starter:0,bodyWeightOnly:!0,name:"Обратные отжимания от скамьи",short:"трицепс",reps:"12–15 повторов",gif:"./gifs/0129.gif",muscles:["triceps"],tip:"Руки на краю устойчивого стула или дивана позади корпуса. Опускайтесь, сгибая локти строго назад до прямого угла, и мощно выжимайте себя вверх."},{key:"bw_crunch",equipment:"bw",pattern:"core",type:"iso",restSec:45,starter:0,bodyWeightOnly:!0,name:"Скручивания на пресс",short:"скручивания",reps:"15–20 повторов",gif:"./gifs/0001.gif",muscles:["abdominals"],tip:"Поясница плотно прижата к полу! Скручивайте только верхнюю часть корпуса, приближая ребра к тазу. Не тяните шею руками."},{key:"bw_calf",equipment:"bw",pattern:"calves",type:"iso",restSec:45,starter:0,bodyWeightOnly:!0,name:"Подъёмы на носки на одной ноге",short:"икры",reps:"15–20 повторов",gif:"./gifs/1387.gif",muscles:["calves"],tip:"Стоя на одной ноге у стены для равновесия. Поднимайтесь максимально высоко на носок, пауза 1 секунда сверху, плавно вниз."},{key:"kb_squat",equipment:"kb",pattern:"squat",type:"big",restSec:90,starter:12,singleDumbbell:!0,name:"Кубковые приседания с гирей",short:"присед с гирей",reps:"10–12 повторов",gif:"./gifs/0534.gif",muscles:["quads","glutes"],tip:"Держите гирю за дужку обеими руками у груди. Локти направлены вниз. Приседайте глубоко с прямой спиной, разводя колени в стороны носков."},{key:"kb_swing",equipment:"kb",pattern:"hinge",type:"big",restSec:75,starter:12,singleDumbbell:!0,name:"Махи гирей двумя руками",short:"махи гирей",reps:"15–20 повторов",gif:"./gifs/0549.gif",muscles:["hamstrings","glutes","lowerback"],tip:"⚠️ Движение выполняется МОЩНЫМ толчком бедер и ягодиц вперед, а не руками или приседом! В нижней точке отводите таз назад с ровной спиной."},{key:"kb_row",equipment:"kb",pattern:"h_pull",type:"big",restSec:90,starter:12,singleDumbbell:!0,name:"Тяга гири в упоре одной рукой",short:"тяга гири",reps:"10–12 повторов",gif:"./gifs/0541.gif",muscles:["lats","traps-middle","biceps"],tip:"Опора свободным коленом и рукой о скамью или диван (разгрузка спины!). Тяните гирю к бедру, направляя локоть назад и вверх."},{key:"kb_floor_press",equipment:"kb",pattern:"h_push",type:"big",restSec:90,starter:12,singleDumbbell:!0,name:"Жим гири с пола одной рукой",short:"жим с пола",reps:"10–12 повторов",gif:"./gifs/1298.gif",muscles:["chest","front-shoulders","triceps"],tip:"Лежа на коврике, гиря лежит на предплечье. Выжимайте гирю вверх над грудью до полного выпрямления руки."},{key:"kb_ohp",equipment:"kb",pattern:"v_push",type:"big",restSec:75,starter:8,singleDumbbell:!0,name:"Жим гири одной рукой стоя",short:"жим гири",reps:"8–10 повторов",gif:"./gifs/0539.gif",muscles:["front-shoulders","triceps"],tip:"Гиря на груди в замке. Пресс зажат. Выжимайте гирю вертикально над головой, плавно вращая кисть наружу."},{key:"bb_squat",equipment:"bb",pattern:"squat",type:"big",restSec:120,starter:30,name:"Приседания со штангой на спине",short:"присед со шт.",reps:"8–10 повторов",gif:"./gifs/0043.gif",muscles:["quads","glutes"],tip:"Гриф на верхней части трапеций. Лопатки сведены. Отводите таз назад, колени по направлению носков, глубина до параллели."},{key:"bb_bench",equipment:"bb",pattern:"h_push",type:"big",restSec:90,starter:30,name:"Жим штанги лёжа",short:"жим штанги",reps:"8–10 повторов",gif:"./gifs/0025.gif",muscles:["chest","front-shoulders","triceps"],tip:"Лопатки сведены и прижаты к скамье. Опускайте гриф под контролем на середину груди, локти под углом 45–60° к телу."},{key:"bb_rdl",equipment:"bb",pattern:"hinge",type:"big",restSec:90,starter:35,name:"Румынская тяга со штангой",short:"румынка со шт.",reps:"8–10 повторов",gif:"./gifs/0085.gif",muscles:["hamstrings","glutes","lowerback"],tip:"⚠️ Спина зафиксирована прямой. Гриф скользит по ногам не ниже середины голени. Движение строго за счет отведения таза назад."},{key:"bb_row",equipment:"bb",pattern:"h_pull",type:"big",restSec:90,starter:25,name:"Тяга штанги в наклоне к поясу",short:"тяга штанги",reps:"8–10 повторов",gif:"./gifs/0027.gif",muscles:["lats","traps-middle","biceps"],tip:"Наклон корпуса 45°, колени мягкие. Тяните гриф к низу живота, прижимая локти к бокам и сводя лопатки."},{key:"bb_ohp",equipment:"bb",pattern:"v_push",type:"big",restSec:90,starter:20,name:"Армейский жим штанги стоя",short:"армейский жим",reps:"8–10 повторов",gif:"./gifs/0091.gif",muscles:["front-shoulders","triceps"],tip:"Стоя, ягодицы и пресс сжаты для фиксации поясницы. Жмите штангу от ключиц строго вверх над головой."},{key:"bb_curl",equipment:"bb",pattern:"biceps",type:"iso",restSec:60,starter:15,name:"Подъём штанги на бицепс",short:"бицепс со шт.",reps:"10–12 повторов",gif:"./gifs/0031.gif",muscles:["biceps","forearms"],tip:"Локти прижаты к корпусу и не уходят вперед. Поднимайте штангу силой бицепсов без раскачки корпусом."},{key:"bb_close_bench",equipment:"bb",pattern:"triceps",type:"iso",restSec:60,starter:20,name:"Жим штанги узким хватом",short:"узкий жим",reps:"10–12 повторов",gif:"./gifs/0030.gif",muscles:["triceps","chest"],tip:"Хват на ширине плеч (не слишком узко, чтобы беречь запястья). Локти идут близко к корпусу, акцент на трицепс."},{key:"band_squat",equipment:"band",pattern:"squat",type:"big",restSec:60,starter:5,name:"Приседания с эспандером",short:"присед с резинкой",reps:"12–15 повторов",gif:"./gifs/1004.gif",muscles:["quads","glutes"],tip:"Резинка под стопами, верхний край держите у плеч. Приседайте с ровной спиной, преодолевая натяжение резины на подъёме."},{key:"band_press",equipment:"band",pattern:"h_push",type:"big",restSec:60,starter:5,name:"Жим эспандера от груди",short:"жим с резинкой",reps:"12–15 повторов",gif:"./gifs/1254.gif",muscles:["chest","front-shoulders","triceps"],tip:"Резина за спиной на уровне лопаток. Выжимайте руки вперед, сжимая грудные мышцы в точке максимального натяжения."},{key:"band_row",equipment:"band",pattern:"h_pull",type:"big",restSec:60,starter:5,name:"Тяга резинки к поясу сидя",short:"тяга с резинкой",reps:"12–15 повторов",gif:"./gifs/3144.gif",muscles:["lats","traps-middle","biceps"],tip:"Сидя на коврике с прямыми ногами, резина зацеплена за стопы. Спина прямая. Тяните концы резинки к поясу, сводя лопатки."},{key:"band_ohp",equipment:"band",pattern:"v_push",type:"big",restSec:60,starter:5,name:"Жим эспандера над головой",short:"жим плечи резина",reps:"12–15 повторов",gif:"./gifs/0997.gif",muscles:["front-shoulders","triceps"],tip:"Стоя на резинке, держите края у плеч. Выжимайте руки вертикально вверх, сохраняя напряжение в прессе."},{key:"band_curl",equipment:"band",pattern:"biceps",type:"iso",restSec:60,starter:5,name:"Сгибания на бицепс с эспандером",short:"бицепс с резинкой",reps:"12–15 повторов",gif:"./gifs/0968.gif",muscles:["biceps"],tip:"Наступите на резинку, локти прижмите к бокам. Сгибайте руки в локтях с фиксацией пикового сокращения бицепса на 1 секунду."},{key:"cable_lat_pull",equipment:"cable",pattern:"h_pull",type:"big",restSec:90,starter:35,name:"Тяга верхнего блока к груди",short:"тяга верт. блока",reps:"10–12 повторов",gif:"./gifs/0150.gif",muscles:["lats","traps-middle","biceps"],tip:"Сидя с фиксацией бедер валиками. Хват чуть шире плеч. Слегка отклоните корпус назад (на 10–15°), тяните рукоять к верхней части груди, сводя лопатки."},{key:"cable_row",equipment:"cable",pattern:"h_pull",type:"big",restSec:90,starter:30,name:"Горизонтальная тяга блока к поясу",short:"тяга блока к поясу",reps:"10–12 повторов",gif:"./gifs/0861.gif",muscles:["lats","traps-middle","rear-shoulders","biceps"],tip:"Упритесь стопами в платформу, колени слегка согнуты, спина прямая. Тяните рукоять к низу живота, максимально сводя лопатки назад."},{key:"cable_press",equipment:"cable",pattern:"h_push",type:"big",restSec:90,starter:20,name:"Жим от груди в кроссовере лёжа",short:"жим в кроссовере",reps:"10–12 повторов",gif:"./gifs/0151.gif",muscles:["chest","front-shoulders","triceps"],tip:"Лёжа на скамье между блоками. Плавный контролируемый жим вверх над грудью с пиковым сжатием грудных мышц в верхней точке."},{key:"cable_ohp",equipment:"cable",pattern:"v_push",type:"big",restSec:75,starter:15,name:"Жим над головой в блоке стоя",short:"жим плечи блок",reps:"10–12 повторов",gif:"./gifs/0148.gif",muscles:["front-shoulders","triceps"],tip:"Рукояти от нижних блоков на уровне плеч. Корпус стабилен, пресс напряжен. Выжимайте рукояти вверх, сохраняя непрерывное натяжение троса."},{key:"cable_curl",equipment:"cable",pattern:"biceps",type:"iso",restSec:60,starter:15,name:"Сгибания на бицепс в блоке с канатом",short:"бицепс в блоке",reps:"12–15 повторов",gif:"./gifs/0165.gif",muscles:["biceps","forearms"],tip:"Локти прижаты к бокам и неподвижны. Сгибайте руки в локтях, разводя кисти в стороны в верхней точке для максимального пика бицепса."},{key:"cable_pushdown",equipment:"cable",pattern:"triceps",type:"iso",restSec:60,starter:20,name:"Разгибания на трицепс в кроссовере",short:"трицепс в блоке",reps:"12–15 повторов",gif:"./gifs/0201.gif",muscles:["triceps"],tip:"Локти строго зафиксированы у туловища. Разгибайте руки вниз до полного выпрямления, напрягая трицепс на 1 секунду."},{key:"cable_deadlift",equipment:"cable",pattern:"hinge",type:"big",restSec:90,starter:30,name:"Румынская тяга в кроссовере",short:"рум. тяга в блоке",reps:"10–12 повторов",gif:"./gifs/0157.gif",muscles:["hamstrings","glutes","lowerback"],tip:"Трос от нижнего блока. Отводите таз назад с прямой спиной, чувствуя растяжение задней поверхности бедра, затем мощно разгибайтесь за счёт ягодиц."},{key:"cable_calf",equipment:"cable",pattern:"calves",type:"iso",restSec:45,starter:30,name:"Подъёмы на носки в блоке",short:"икры в блоке",reps:"15–20 повторов",gif:"./gifs/1375.gif",muscles:["calves"],tip:"Стоя на платформе или подставке, держите рукоять от нижнего блока. Поднимайтесь на носки на максимальную высоту с секундной фиксацией."},{key:"cable_crunch",equipment:"cable",pattern:"core",type:"iso",restSec:45,starter:25,name:"Скручивания на коленях в кроссовере (Молитва)",short:"пресс в кроссовере",reps:"15–20 повторов",gif:"./gifs/0175.gif",muscles:["abdominals"],tip:"Стоя на коленях перед верхним блоком, канат у лба. Скручивайте корпус вниз силой пресса, округляя спину и приближая ребра к тазу."},{key:"mach_leg_press",equipment:"mach",pattern:"squat",type:"big",restSec:120,starter:50,name:"Жим ногами в платформе 45°",short:"жим ногами",reps:"10–12 повторов",gif:"./gifs/0739.gif",muscles:["quads","glutes"],tip:"Поясница и таз плотно прижаты к спинке сиденья! Стопы на ширине плеч в середине платформы. Опускайте платформу плавно, не отрывая таз от сиденья."},{key:"mach_chest_press",equipment:"mach",pattern:"h_push",type:"big",restSec:90,starter:30,name:"Жим от груди в тренажёре сидя",short:"жим в тренажёре",reps:"10–12 повторов",gif:"./gifs/0576.gif",muscles:["chest","front-shoulders","triceps"],tip:"Отрегулируйте высоту сиденья так, чтобы рукояти были на уровне середины груди. Лопатки сведены. Мощный жим вперед с контролем движения назад."},{key:"mach_row",equipment:"mach",pattern:"h_pull",type:"big",restSec:90,starter:30,name:"Тяга в хаммере к поясу",short:"тяга в хаммере",reps:"10–12 повторов",gif:"./gifs/0571.gif",muscles:["lats","traps-middle","rear-shoulders","biceps"],tip:"Грудь плотно прижата к подушке упора. Тяните рукояти к поясу, акцентируя сведение лопаток и сокращение широчайших мышц."},{key:"mach_shoulder_press",equipment:"mach",pattern:"v_push",type:"big",restSec:75,starter:20,name:"Жим на плечи в тренажёре сидя",short:"жим плечи тренажёр",reps:"10–12 повторов",gif:"./gifs/0603.gif",muscles:["front-shoulders","triceps"],tip:"Спина ровно прижата к спинке сиденья. Выжимайте рукояти вверх над головой, не распрямляя локти до щелчка в верхней точке."},{key:"mach_leg_curl",equipment:"mach",pattern:"hinge",type:"big",restSec:75,starter:25,name:"Сгибания ног в тренажёре",short:"сгибания ног",reps:"10–12 повторов",gif:"./gifs/0599.gif",muscles:["hamstrings"],tip:"Валик располагается чуть выше пяток. Колени на одной оси с шарниром тренажёра. Сгибайте ноги с максимальным сокращением бицепса бедра."},{key:"mach_bicep",equipment:"mach",pattern:"biceps",type:"iso",restSec:60,starter:15,name:"Сгибания на бицепс в тренажёре",short:"бицепс тренажёр",reps:"12–15 повторов",gif:"./gifs/0575.gif",muscles:["biceps"],tip:"Плечи и трицепсы плотно лежат на парте Скотта. Сгибайте руки вверх, контролируя плавное растяжение бицепса в нижней точке."},{key:"mach_tricep",equipment:"mach",pattern:"triceps",type:"iso",restSec:60,starter:20,name:"Разгибания на трицепс в тренажёре сидя",short:"трицепс тренажёр",reps:"12–15 повторов",gif:"./gifs/0607.gif",muscles:["triceps"],tip:"Локти на опорных подушках. Разгибайте руки вперед-вниз силой трицепса, задерживаясь на полсекунды в точке максимального сокращения."},{key:"mach_calf",equipment:"mach",pattern:
