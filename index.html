    <meta charset="UTF-8" />

      name="viewport"

    <!--
      Отладочная ловушка ошибок.
      Показывается ТОЛЬКО если открыть с ?debug=1 или через deep-link ?startapp=debug.
      Обычные пользователи её никогда не увидят: ошибки загрузки картинок/скриптов
      не считаются фатальными, а React вшит в этот файл и не зависит от CDN.
    -->
    <script>
      (function () {
        var debug = false;
        try {
          debug =
            /[?&]debug=1/.test(location.search) ||
            /tgWebAppStartParam=debug/.test(location.hash + location.search);
        } catch (e) {}
        window.__nfDebug = debug;
        if (!debug) return;
        function show(msg) {
          try {
            var d = document.createElement("div");
            d.style.cssText =
              "position:fixed;top:0;left:0;right:0;z-index:99999;background:#6E1414;color:#fff;font:12px/1.5 ui-monospace,monospace;padding:10px 12px;white-space:pre-wrap;word-break:break-all;max-height:45vh;overflow:auto";
            d.textContent = msg;
            d.onclick = function () {
              d.remove();
            };
            (document.body || document.documentElement).appendChild(d);
          } catch (e) {}
        }
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (t && t !== window && t.tagName) return; // ресурсы (img/script) — не фатально
            show("⚠ " + (e.message || "Ошибка") + (e.filename ? "\n" + String(e.filename).split("/").pop() + ":" + e.lineno : ""));
          },
          true
        );
        window.addEventListener("unhandledrejection", function (e) {
          show("⚠ promise: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
        });
      })();
    </script>

if",muscles:["lats","traps-middle","rear-shoulders","biceps"],tip:"⚠️ ВАЖНО: делайте ТОЛЬКО с упором одной рукой и коленом в диван или скамью! Опора снимает нагрузку с поясницы на 100%. Корпус параллелен полу, тяните гантель к поясу, сжимая широчайшую мышцу и сводя лопатку."},{key:"floor",equipment:"db",pattern:"h_push",type:"big",restSec:90,starter:7.5,name:"Жим гантелей лёжа",short:"жим лёжа",reps:"10–12 повторов",gif:"./gifs/floor.gif",muscles:["chest","front-shoulders","triceps"],tip:"Лёжа на спине на коврике, поясница прижата к полу. Локти под углом 45° к корпусу. Выжимайте гантели вверх над грудью, плавно опуская до касания плечами пола."},{key:"ohp",equipment:"db",pattern:"v_push",type:"big",restSec:75,starter:5,name:"Жим гантелей стоя над головой",short:"жим вверх",reps:"10–12 повторов",gif:"./gifs/ohp.gif",muscles:["front-shoulders","triceps"],tip:"Стоя, пресс и ягодицы напряжены и зажаты — это страхует поясницу от прогиба назад! Выжимайте гантели вверх от плеч над головой, не отклоняя корпус назад."},{key:"curl",equipment:"db",pattern:"biceps",type:"iso",restSec:60,starter:5,name:"Сгибания на бицепс",short:"бицепс",reps:"12–15 повторов",gif:"./gifs/curl.gif",muscles:["biceps","forearms"],tip:"Стоя, локти зафиксированы у туловища. Поднимай гантели плавным движением, разворачивая кисти к себе в верхней точке."},{key:"tricep",equipment:"db",pattern:"triceps",type:"iso",restSec:60,starter:5,singleDumbbell:!0,name:"Разгибание на трицепс",short:"трицепс",reps:"12–15 повторов",gif:"./gifs/tricep.gif",muscles:["triceps"],tip:"Возьми 1 гантель ОБЕИМИ руками за блин, подняв над головой. Опускай за голову и полностью разгибай руки вверх."},{key:"shrug",equipment:"db",pattern:"h_pull",type:"iso",restSec:60,starter:5,name:"Шраги с гантелями",short:"шраги",reps:"12–15 повторов",gif:"./gifs/shrug.gif",muscles:["traps"],tip:"Стоя, гантели в опущенных руках. Поднимай плечи вверх к ушам, без сгибания локтей, задержись сверху и плавно опускай."},{key:"bend",equipment:"db",pa
